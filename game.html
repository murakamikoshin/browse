<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>帳場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Shippori+Mincho:wght@400;600&family=Zen+Old+Mincho:wght@400;500;700;900&display=swap">
<style>
:root{
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --ink:#080C0E; --ink2:#0E1417; --edge:#1C2527;
  --fg:#DCE1DD; --fg-dim:#7E8A86; --fg-faint:#485351;
  --accent:#6E7673; --soft:rgba(110,118,115,.12); --glow:0;
  --ember:#C2603A; --paper:#E3E0D5; --short:#B3543F;
}
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition-duration:.001s !important; } }
*{ box-sizing:border-box; }
/* 送るのに押す画面なので、なぞると字が選択されてしまう。選択そのものを切る。
   長押しの吹き出しと、押した瞬間の青い被せも消す。 */
html,body{ -webkit-user-select:none; -moz-user-select:none; user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
/* どの画面も一枚に収める。長い説明は「遊び方」に畳んだ。
   本文の窓は元から中で送るので、頁ごと動くことはもう無い */
html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
body{
  background:var(--ink); color:var(--fg);
  font-family:var(--mincho);
  font-weight:500;
  font-size:16px; line-height:2.25; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(100% 62% at 50% 0%, var(--soft), transparent 64%);
  opacity:calc(.4 + var(--glow)*.6); transition:opacity 1.4s ease;
}
.mono{ font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums; }
.wrap{ position:relative; z-index:1; max-width:40em; margin:0 auto;
  padding:0 clamp(16px,4vw,26px); height:100dvh; }
.scene{ display:none; } .scene.on{ display:block; }

/* 題 */
#title.on{ height:100dvh; display:flex; align-items:center; justify-content:center; }
/* 真ん中に置くと下が余って見えるので、少し上に寄せる */
.ti-in{ text-align:center; width:100%; transform:translateY(-8vh); }
.ti-t{ font-size:clamp(3.4rem,17vw,6.4rem); font-weight:900; letter-spacing:.34em;
  text-indent:.34em; margin:14px 0 0; line-height:1.1; }
/* 題のロゴ。焼き込みは tools/build_logo.py。素材が無ければ字のまま出す */
/* 横だけでなく高さでも抑える。ここが大きいとメニューが画面の外に出る */
.ti-logo{ display:inline-block; width:min(62vw,21rem,32vh); max-width:100%;
  background-repeat:no-repeat; background-position:center; background-size:contain; }
.ti-r{ width:3.4em; height:1px; background:rgba(120,132,128,.4);
  margin:clamp(14px,3vh,26px) auto clamp(12px,2.6vh,24px); }
.ti-s{ color:var(--fg-dim); font-size:.84rem; line-height:2; margin:0 0 clamp(20px,4vh,38px); }
.ti-m{ display:flex; flex-direction:column; gap:9px; max-width:15em; margin:0 auto; }
.ti-m button{ padding:13px; background:transparent; border:1px solid var(--edge);
  color:var(--fg-dim); font-family:inherit; font-size:.94rem; letter-spacing:.28em;
  text-indent:.28em; cursor:pointer; transition:border-color .25s,color .25s; }
.ti-m button:hover:not(:disabled){ border-color:var(--accent); color:var(--fg); }
.ti-m button:disabled{ opacity:.28; cursor:not-allowed; }
.ti-m button:first-child{ border-color:var(--accent); color:var(--accent); }
.ti-m2{ flex-direction:row; max-width:none; justify-content:center; margin-top:16px; }
.ti-m2 button{ padding:9px 18px; font-size:.8rem; letter-spacing:.18em; }
.ti-m2 button:first-child{ border-color:var(--edge); color:var(--fg-dim); }
.ti-f{ margin:clamp(18px,3.4vh,34px) 0 0; font-size:.66rem; color:var(--fg-faint);
  letter-spacing:.1em; }
/* 画面が低いとき。横に置く場所はあるので、縦だけ詰める */
@media (max-height:620px){
  .ti-s{ font-size:.78rem; line-height:1.8; }
  .ti-m{ gap:7px; }
  .ti-m button{ padding:10px; font-size:.88rem; }
  .ti-f{ font-size:.6rem; }
}
/* もっと低いとき。同じ断りは説明の三枚目にも書いてあるので、ここでは畳む */
@media (max-height:540px){
  .ti-in{ transform:none; }
  .ti-in .kicker{ display:none; }
  .ti-r{ margin:10px auto 10px; }
  .ti-s{ font-size:.74rem; line-height:1.7; margin-bottom:14px; }
  .ti-s br{ display:none; }
  .ti-m{ gap:5px; }
  .ti-m button{ padding:8px; font-size:.84rem; letter-spacing:.2em; }
  .ti-f{ display:none; }
}

/* 支払い */
#pay.on{ height:100dvh; display:flex; align-items:center; }
#pay .inner{ width:100%; padding:24px 0; }

/* 設定 */
#setbox{ position:fixed; inset:0; z-index:57; display:none; overflow-y:auto;
  background:#060909; padding:0 clamp(16px,5vw,26px); }
#setbox.on{ display:flex; align-items:center; justify-content:center; }
#setbox .in{ max-width:22em; width:100%; }
#setbox h3{ font-size:1.05rem; font-weight:500; letter-spacing:.28em; text-align:center;
  margin:0 0 30px; color:var(--accent); }
.set-r{ display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:15px 2px; border-top:1px solid var(--edge); font-size:.94rem; color:var(--fg-dim); }
.set-r:last-of-type{ border-bottom:1px solid var(--edge); }
.set-r button{ min-width:6em; padding:8px 16px; background:transparent;
  border:1px solid var(--accent); color:var(--accent); font-family:inherit;
  font-size:.88rem; letter-spacing:.2em; cursor:pointer; }
.set-r button.off{ border-color:var(--edge); color:var(--fg-faint); }
.set-3{ display:flex; gap:6px; }
.set-3 button{ min-width:3.4em; padding:8px 0; letter-spacing:.1em; }
.set-n{ margin:22px 0 0; font-size:.7rem; color:var(--fg-faint); text-align:center; }
#setclose{ position:fixed; z-index:63; top:12px; right:12px; padding:8px 16px;
  background:rgba(8,12,14,.9); border:1px solid var(--edge); color:var(--fg-dim);
  font-family:inherit; font-size:.84rem; cursor:pointer; }

/* 説明。一枚ずつ送る。頁を長くしない */
#intro.on{ height:100dvh; display:flex; align-items:center; }
#intro .inner{ width:100%; padding:24px 0; }
#intro .t{ margin-bottom:30px; font-size:1.5rem; letter-spacing:.2em; }
#intro .terms{ margin-bottom:34px; }
#intro .terms div{ line-height:1.95; }
.ipage{ font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.24em;
  color:var(--fg-faint); text-align:center; margin-top:22px; }
.kicker{ font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.3em;
         text-transform:uppercase; color:var(--fg-faint); }
h1.t{ font-size:2.4rem; font-weight:900; letter-spacing:.3em; margin:16px 0 6px; }
.sub{ color:var(--fg-dim); font-size:.86rem; line-height:1.95; margin:0 0 46px; }
.terms{ border-top:1px solid var(--edge); border-bottom:1px solid var(--edge);
        padding:20px 0; margin:0 0 44px; display:flex; flex-direction:column; gap:9px; }
.terms div{ font-size:.85rem; color:var(--fg-dim); display:flex; gap:12px; }
.terms > div > span:first-child{ font-family:"IBM Plex Mono",monospace; font-size:.62rem;
  color:var(--fg-faint); letter-spacing:.1em; min-width:2.4em; padding-top:.35em; flex:0 0 auto; }
/* 本文は一つの欄にまとめる。ここを分けると、中の <b> が別の欄になって変な位置で折れる */
.terms > div > span.d{ flex:1 1 auto; }
.amtrow{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
@media (max-width:680px){
  .amt{ font-size:1.9rem; min-width:0; flex:1 1 100%; }
  .amtrow{ gap:10px; }
  .pm button{ width:56px; height:56px; }        /* 指で押せる大きさ */
  .real{ margin-left:0; }
  .unit{ order:3; flex:1 1 100%; }
  h1.t{ font-size:1.9rem; }
  .sub{ font-size:.82rem; margin-bottom:30px; }
  .terms div{ font-size:.8rem; }
  .terms > div > span:first-child{ min-width:2.8em; }
  .terms2{ margin-top:-14px; margin-bottom:30px; }
  #pay .inner{ padding:40px 0; }
  .note{ font-size:.68rem; }
}
.amt{ font-family:var(--mincho); font-size:2.5rem; letter-spacing:.06em;
      min-width:6.1em; display:inline-block; font-weight:500; color:var(--accent); line-height:1.1; transition:color .8s ease; }
.pm{ display:flex; gap:8px; }
.pm button{ width:48px; height:48px; background:transparent; border:1px solid var(--edge);
  color:var(--fg-dim); font-size:1.2rem; cursor:pointer; font-family:"IBM Plex Mono",monospace;
  transition:border-color .2s,color .2s; }
.pm button:hover:not(:disabled){ border-color:var(--accent); color:var(--fg); }
.pm button:disabled{ opacity:.25; cursor:not-allowed; }
.unit{ font-family:var(--mincho); font-size:.78rem; letter-spacing:.06em; color:var(--fg-faint); }
.real{ font-family:var(--mincho); font-size:.92rem; letter-spacing:.06em; color:var(--fg-dim);
       margin-left:auto; }
.real b{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
         font-size:1.15rem; color:var(--accent); font-weight:500; margin-left:.4em; }
.real.free b{ font-family:var(--mincho); font-size:1rem; color:var(--fg-dim); }
.confirm b{ font-family:"IBM Plex Mono",monospace; color:var(--accent); font-weight:500; }
.terms b{ color:var(--fg); font-weight:500; }
.unit b{ color:var(--fg-dim); font-weight:500; }
.ladder{ display:flex; gap:3px; height:5px; margin-bottom:40px; }
.ladder i{ flex:1; background:#141B1D; transition:background .4s ease; }
.ladder i.on{ background:var(--accent); }
.ladder i.edge{ background:#2C3739; }
.ladder i.pay{ background:var(--ember); }
button.go{ width:100%; padding:17px; background:transparent; border:1px solid var(--accent);
  color:var(--accent); font-family:inherit; font-size:1rem; letter-spacing:.28em; cursor:pointer;
  transition:background .3s; }
button.go:hover{ background:var(--soft); }
button.go:focus-visible, .pm button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
.confirm{ margin-top:18px; padding:18px 20px; border:1px solid var(--edge); background:rgba(20,27,29,.5); }
.confirm p{ margin:0 0 14px; font-size:.88rem; color:var(--fg-dim); }
.confirm .row{ display:flex; gap:9px; flex-wrap:wrap; }
.confirm button{ padding:9px 20px; background:transparent; border:1px solid var(--edge);
  color:var(--fg-dim); font-family:inherit; font-size:.9rem; cursor:pointer; }
.confirm button:hover{ border-color:var(--accent); color:var(--fg); }
.terms2{ margin-top:-24px; margin-bottom:44px; }
.terms-h{ font-family:var(--mincho); font-size:.72rem; letter-spacing:.28em;
          color:var(--fg-faint); padding-bottom:6px; }
.terms > div > span:first-child{ min-width:3.2em; }
.note b{ color:var(--fg-dim); font-weight:500; }
.note{ margin-top:34px; font-size:.72rem; line-height:1.9; color:var(--fg-faint); }

/* 上部（線香） */
.hud{ position:sticky; top:0; z-index:20; background:rgba(8,12,14,.94);
      border-bottom:1px solid var(--edge); backdrop-filter:blur(9px); }
.hud-in{ max-width:40em; margin:0 auto; padding:12px clamp(16px,4vw,26px);
         display:flex; align-items:center; gap:15px; flex-wrap:wrap; }
.hud-lab{ font-family:var(--mincho); font-size:.58rem; letter-spacing:.24em;
          text-transform:uppercase; color:var(--fg-faint); }
.sticks{ display:flex; gap:8px; align-items:flex-end; height:28px; }
.stick{ width:2px; height:26px; background:#333C3A; position:relative; transition:height .6s ease,background .6s ease; }
.stick.lit{ background:linear-gradient(180deg,var(--ember) 0 3px,#8B7A5E 3px 100%); }
.stick.lit::after{ content:""; position:absolute; top:-3px; left:-1.5px; width:5px; height:5px;
  border-radius:50%; background:var(--ember); filter:blur(2px); animation:gl 2.4s ease-in-out infinite; }
@keyframes gl{ 0%,100%{opacity:.5} 50%{opacity:1} }
.stick.spent{ height:4px; background:#333C3A; } .stick.spent::after{ display:none; }
.note-n{ font-family:var(--mincho); font-size:.74rem; letter-spacing:.08em;
  color:var(--accent); border:1px solid var(--accent); padding:3px 9px; }
.place{ margin-left:auto; margin-right:4px; font-family:var(--mincho); font-size:.62rem;
        letter-spacing:.18em; color:var(--fg-dim); }

/* 本文 */
.chap{ font-family:var(--mincho); font-size:.7rem; letter-spacing:.5em;
       color:var(--fg-faint); padding:44px 0 6px; }

/* 章の札。真ん中に出て、しばらく置いて、消える。二度目からは上の一行だけ */
#chapcard{ position:absolute; inset:0; z-index:30; display:none;
  align-items:center; justify-content:center; background:rgba(6,9,10,.9);
  opacity:0; transition:opacity .9s ease; cursor:pointer; }
#chapcard.on{ display:flex; }
#chapcard.in{ opacity:1; }
.cc-in{ text-align:center; transform:translateY(6px); transition:transform 1.6s ease; }
#chapcard.in .cc-in{ transform:none; }
.cc-n{ font-family:var(--mincho); font-size:.86rem; letter-spacing:.62em;
       color:var(--fg-faint); text-indent:.62em; }
.cc-r{ width:2.6em; height:1px; background:rgba(120,132,128,.34); margin:20px auto; }
.cc-t{ font-family:var(--mincho); font-weight:700; font-size:2.1rem;
       letter-spacing:.44em; color:var(--fg); text-indent:.44em; }
@media (max-width:520px){ .cc-t{ font-size:1.6rem; } }
h2.ct{ font-size:1.4rem; font-weight:800; letter-spacing:.16em; margin:0 0 38px; }
p.l{ margin:0 0 1.3em; animation:fu .5s ease-out; }
@keyframes fu{ from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }
.more{ margin:18px 0 40px; }
.more button{ background:none; border:none; color:var(--fg-faint); font-family:var(--mincho);
  font-size:.68rem; letter-spacing:.2em; cursor:pointer; padding:10px 0; }
.more button:hover{ color:var(--fg-dim); }
.ask{ cursor:inherit; }
.reveal .ask{ box-shadow:inset 0 -1px 0 rgba(185,146,69,.5); }
.ask.used{ color:var(--fg-dim); }
.ask.noted{ box-shadow:inset 0 -1px 0 rgba(185,146,69,.34); }
.nothing{ animation:no .5s ease-out; }
@keyframes no{ 0%{background:rgba(120,132,128,.09)} 100%{background:transparent} }

/* 帳場さん */
.cb{ margin:26px 0; border-left:2px solid var(--accent); padding:15px 0 15px 18px; animation:fu .45s ease-out; }
.cb .who{ font-family:var(--mincho); font-size:.6rem; letter-spacing:.2em;
          color:var(--accent); margin-bottom:.5em; }
.cb p{ margin:0 0 13px; }
.acts{ display:flex; gap:9px; flex-wrap:wrap; }
.acts button{ padding:9px 17px; background:transparent; border:1px solid var(--edge);
  color:var(--fg-dim); font-family:inherit; font-size:.88rem; cursor:pointer;
  transition:border-color .2s,color .2s; }
.acts button:hover:not(:disabled){ border-color:var(--accent); color:var(--fg); }
.acts button:disabled{ opacity:.3; cursor:not-allowed; }
.stub{ margin:20px 0; animation:fu .6s ease-out; }
.stub-in{ display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:.66rem;
  line-height:1.85; background:var(--paper); color:#20201C; padding:10px 14px; letter-spacing:.05em;
  box-shadow:0 9px 24px rgba(0,0,0,.5); }
.stub-in .amt2{ letter-spacing:.4em; color:#6A6558; }
/* 買うたび、自分の行の横に線が一本増える。額は伏せたまま、減っていることだけを見せる */
.stub-in .tally{ margin-top:7px; padding-top:6px; border-top:1px dashed #98918255;
  font-family:var(--mincho); font-size:.9rem; letter-spacing:.34em; color:#8C1F1F; }

/* 地図 */
.map{ margin:34px 0 0; padding-top:26px; border-top:1px solid var(--edge); }
.map-l{ font-family:var(--mincho); font-size:.6rem; letter-spacing:.24em;
        text-transform:uppercase; color:var(--fg-faint); margin-bottom:14px; }
.map .acts button.here{ border-color:var(--accent); color:var(--accent); }

/* 扉 */
.seal{ display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:15px;
       padding:15px 0; border-bottom:1px solid var(--edge); opacity:0; }
.seal.in{ animation:fu .55s ease-out forwards; }
.seal-n{ font-size:.96rem; } .seal-n small{ display:block; font-size:.7rem; color:var(--fg-faint); margin-top:2px; }
.seal-p{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:.84rem; color:var(--fg-dim); }
.seal-s{ font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.18em;
         padding:4px 10px; border:1px solid var(--edge); white-space:nowrap; }
.seal.open .seal-s{ color:var(--accent); border-color:var(--accent); }
.seal.shut .seal-s{ color:var(--short); border-color:#582A22; }
.seal.shut .seal-n,.seal.shut .seal-p{ color:var(--fg-faint); }
.sf{ margin-top:20px; padding:15px 17px; border:1px solid #582A22; background:rgba(179,84,63,.06);
     display:flex; justify-content:space-between; align-items:baseline; gap:14px; opacity:0;
     animation:fu .6s ease-out .3s forwards; }
.sf span{ font-size:.85rem; color:#D28C79; }
.sf b{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
       font-size:1.45rem; color:var(--short); font-weight:500; }
.slip{ margin:32px 0; opacity:0; animation:fu .7s ease-out .6s forwards; }
.slip-in{ display:inline-block; min-width:min(320px,100%); background:var(--paper); color:#1C1A16;
  font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;  /* 紙は別の書体のまま */ font-variant-numeric:tabular-nums; font-size:.74rem;
  line-height:1.85; padding:22px 20px 27px; box-shadow:0 18px 44px rgba(0,0,0,.6);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),92% 100%,84% calc(100% - 7px),76% 100%,68% calc(100% - 7px),60% 100%,52% calc(100% - 7px),44% 100%,36% calc(100% - 7px),28% 100%,20% calc(100% - 7px),12% 100%,4% calc(100% - 7px),0 100%); }
.slip-h{ text-align:center; letter-spacing:.2em; font-size:.64rem; padding-bottom:11px; border-bottom:1px dashed #98918255; }
.slip-r{ display:flex; justify-content:space-between; gap:14px; }
.slip-rule{ border-top:1px dashed #98918255; margin:11px 0; }
.slip-s{ color:#8C1F1F; }
.slip-ed{ text-align:center; padding-top:5px; }
.slip-ed .no{ font-size:.64rem; letter-spacing:.24em; color:#6B6558; }
.slip-ed .nm{ font-family:"Shippori Mincho",serif; font-size:1.05rem; font-weight:600;
              letter-spacing:.09em; margin-top:5px; }
.slip-i{ color:#6B6558; font-size:.78rem; padding-left:2.2em; }
.slip-n{ color:#6B6558; font-size:.8rem; margin-top:9px; }
p.l.seal-t{ color:#CFC6B4; }
p.l.fin{ margin-top:2.4em; }
.dawn{ padding:30px 0; font-size:1.05rem; animation:fu 1.1s ease-out; }
.dawn b{ display:block; font-size:.6rem; font-family:"IBM Plex Mono",monospace; letter-spacing:.24em;
         color:var(--fg-faint); font-weight:400; margin-bottom:12px; }
.dev{ margin-top:44px; padding-top:20px; border-top:1px solid var(--edge);
      font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.1em; color:var(--fg-faint);
      display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
.dev label{ display:flex; gap:6px; align-items:center; cursor:pointer; }
.dev input{ accent-color:var(--accent); }
.dev button{ background:none; border:none; color:var(--fg-faint); font-family:inherit;
             font-size:.62rem; letter-spacing:.14em; cursor:pointer; padding:0; }
.dev button:hover{ color:var(--fg-dim); }

/* ---------- 画面。全面が絵。文章と選択肢はその上に浮く ---------- */
#game.on{ position:fixed; inset:0; z-index:5; overflow:hidden; }

/* 絵。ASSETS.md のとおり 16:9 を cover で敷き、左右は切れる前提。 */
#art{ position:absolute; inset:0; z-index:0; overflow:hidden; background:var(--ink); }
#art .lay{ position:absolute; inset:0; background-size:cover; background-position:center;
           background-repeat:no-repeat; transition:filter 1.4s ease, opacity 1.4s ease; }
#art .char,#art .csil{ background-size:auto 92%; background-position:center bottom; opacity:0; }
#art .fog{ position:absolute; inset:0; background:#0A0F12; opacity:var(--fog,0);
           transition:opacity 1.4s ease; }
#art .face{ position:absolute; border-radius:50%; background:#05080A; filter:blur(9px);
            opacity:0; transition:opacity 1s ease; }

。兄に教わった結び方だ。引けば締まって、端を引けば一度でほどける。","船の綱は急いでほどけないと困る、と言われた。何が困るのかは、教わらなかった。","結び終わって、立ち上がった。","音は、止まった。","誰も、この船をもう動かさないのに。"]},{"k":"t19","place":"cha","who":null,"label":"木箱の鍵を、手に取る","lines":["木箱の底に、鍵が一つ入っていた。","古い鍵だった。真鍮が、持つところだけ色が変わっている。","家の鍵にしては小さい。船の鍵にしては、大きい気がした。","帳場さんを見た。帳場さんは湯呑みを両手で包んだまま、何も言わなかった。","「これ、何の鍵か分かりますか」","「存じません。上着の内側に入っておりました」","分からないものは、分からないと言う人だった。","鍵を、箱に戻した。かちり、と小さい音がした。"]},{"k":"t20","place":"cha","who":null,"label":"木箱の小銭を、数える","lines":["木箱の隅に、小銭が寄せてあった。","百円玉が三枚。十円玉が何枚か。一円玉が一枚。","数えていた。数え終わってから、数えている自分に気づいた。","上着のポケットに入っていたものだ。海に出る人は、現金を持たない。落とすから。","それでも、これだけは入っていた。","手のひらに載せると、軽かった。","箱に戻した。並べ方は、元のままにした。"],"ov":{"2":{"4":"数えていた。数え終わってから、数えている自分に気づいた。この町に着いてから、数えてばかりいる。","5":"数えていた。数え終わってから、気づいた。この町では、人が最後に持っていたものを、誰かが必ず数える。"}}},{"k":"t21","place":"cha","who":"帳場さん","label":"帳場さんと、父のときの話をする","lines":["「父のときも、帳場さんでしたよね」","「はい。同じ机で」","帳場さんは湯呑みを置いて、少しだけ笑った。","「お父さんのときも、こうしてお茶をお出ししました。汐里さんは、飲まれませんでしたが」","覚えているのだ。十年前の、十七のわたしが茶を飲まなかったことを。","「よく覚えてますね」","「帳場ですので」","その言い方は、今夜三度目だった。","「父の朝も、読み上げたんですよね」","「読みました。全部」","全部、と言った。順番も、覚えているのだろうと思った。"]},{"k":"t22","place":"cha","who":"帳場さん","label":"帳場さんに、この仕事のことを訊く","lines":["「帳場さんは、ずっとこれを」","「三十年ほどになります」","「その前は」","「信用金庫におりました。この町の支店に」","意外ではなかった。字も、話し方も、そういう人のものだった。","「辞めてから、こちらを」","「頼まれまして。数えるのは、慣れておりますので」","謙遜だと思った。人が足りない町では、できる人が引き受ける。","「大変じゃないですか。一晩中」","「慣れております」","同じ言葉を、二度使った。"]},{"k":"t23","place":"cha","who":"帳場さん","label":"帳場さんに、町の弔いの決まりを訊く","lines":["「読み上げって、どうして始まったんですか」","帳場さんは、しばらく黙ってから答えた。","「昔は、みんな似たようなものを包みました。米や、魚や。額では出さなかった」","「それが、いつから」","「金になってからです。金は目に見えませんので。読まないと、残りません」","「残る」","「はい。誰が、どなたを、どのように思っていたか。それが残ります」","穏やかな声だった。悪いことを言っているようには、聞こえなかった。","いい習わしだと思った。人が惜しまれたことが、形になって残る。"],"ov":{"8":{"3":"いい習わしだと思った。人が惜しまれたことが、形になって残る。残る、という言葉が、少し長く耳に残った。","5":"残るのではない。決まるのだ。明日の朝、この町では、兄がいくらだったかが決まる。"}}},{"k":"t24","place":"cha","who":"帳場さん","label":"帳場さんに、朝までの時間を訊く","lines":["「あと、どれくらいですか」","「線香が尽きるまでです」","机の脇に、束が置いてあった。減っているのは分かるが、あと何本かは数えなかった。","「何本、とは申しません。数えると、急がれますので」","「急いだほうがいいですか」","「いいえ。ただ、朝は来ます」","湯呑みから、湯気がまだ立っていた。","「わたくしは、朝までおります。何かございましたら」","何かがあるとは思えなかった。ただ、そう言ってもらえるのは、ありがたかった。"]},{"k":"t25","place":"ishi","who":null,"label":"兄の番号を、出してみる","lines":["着信履歴から、兄の名前を出した。","押せば、かかる。押しても、誰も出ない。","出ないと分かっている番号にかけるのは、どういうことなのだろう。","東京にいた三年、この番号を自分から押したことは、数えるほどしかなかった。","数えられる、というのが答えだった。","画面を消した。","石段が冷たかった。ずっと座っていたせいだ。"]},{"k":"t26","place":"ishi","who":null,"label":"道の先を、見る","lines":["道は、港のほうへ下っている。灯りは、途中で切れている。","この道を、荷台に乗って何度も下った。ブレーキの音がうるさい自転車だった。","いまは、街灯が一本きりだ。三年前は、もう少しあった気がする。","減ったのは街灯だけではない。船も、人も、家の灯りも。","それでも、この道は港へ続いている。行けば、しおり丸がいる。","明日の朝、柩もこの道を通る。"]},{"k":"t27","place":"ishi","who":null,"label":"空を、見上げる","lines":["星が出ていた。東京では、こんなに見えない。","子供の頃、兄に名前を教わった。ほとんど忘れた。","一つだけ覚えている。あれが北だ、と言われた星。","海に出たとき、あれさえ見えれば帰れる、と兄は言った。","今夜も、同じ場所に出ている。","帰る先があるうちは、そうなのだと思った。"]}];

   支払いが始まる金一万円は、帯3（気づいたのに届かない帯）の入口とちょうど重なる。
   決済には固定費があるので、実額¥100を下回るものは作らない。 */
var PAYFROM=10000;
var realOf=function(v){ return v<PAYFROM ? 0 : v/100; };

function unitFor(v){ return v<1000?100 : v<10000?1000 : v<100000?10000 : 100000; }

function paint(){
  var a=ACC[bandOf(S.paid)], r=document.documentElement.style;
  r.setProperty("--accent",a[0]); r.setProperty("--soft",a[1]); r.setProperty("--glow",String(a[2]));
}


/* ---------- 音 ----------
   波も風も線香も、その場で作る。音の files は積まない。
   旋律は置かない。この夜に音楽は流れていないので、鳴っているのは部屋と海だけ。
   ただ一箇所、第四封が開いたときにだけ、鈴が一度鳴る。満額の人しか聞かない音。 */
/* 音の素材 ここから */
var SND={};
/* 音の素材 ここまで */
/* audio/ に音声を置いて tools/build_audio.py を叩くと、その音だけ合成から差し替わる。
   artifact では外部の音声ホストが遮断されるので、data URI で持つ以外に道がない。 */
var SNDBUF={};
var BEDSND={ minato:"nami", asa:"asa", ishi:"kaze", genkan:"heya", butsu:"heya", cha:"heya" };

var AU={ ctx:null, on:true, master:null, beds:{}, now:null, noise:null };

function auDecode(){
  Object.keys(SND).forEach(function(k){
    var s=SND[k], bin=atob(s.slice(s.indexOf(",")+1)), n=bin.length, a=new Uint8Array(n);
    for(var j=0;j<n;j++) a[j]=bin.charCodeAt(j);
    try{
      AU.ctx.decodeAudioData(a.buffer, function(buf){
        SNDBUF[k]=buf;
        var cur=AU.now;                                  // 鳴っている床が合成なら差し替える
        if(cur && BEDSND[cur]===k && AU.beds[cur] && !AU.beds[cur].file){
          try{ AU.beds[cur].disconnect(); }catch(e){}
          delete AU.beds[cur]; AU.now=null; auPlace(cur);
        }
      }, function(){});
    }catch(e){}
  });
}
function auLoop(k){                                      // 素材の床。継ぎ目でつなぐ
  var s=AU.ctx.createBufferSource(); s.buffer=SNDBUF[k]; s.loop=true;
  var out=auGain(0); out.file=true; s.connect(out); out.connect(AU.master); s.start();
  return out;
}

function auNoise(){
  if(AU.noise) return AU.noise;
  var n=AU.ctx.sampleRate*3, b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
  AU.noise=b; return b;
}
function auSrc(){ var s=AU.ctx.createBufferSource(); s.buffer=auNoise(); s.loop=true; s.start(); return s; }
function auGain(v){ var g=AU.ctx.createGain(); g.gain.value=v; return g; }
function auLfo(hz,depth,target,base){                 // ゆっくり呼吸させる
  var o=AU.ctx.createOscillator(), g=auGain(depth);
  o.frequency.value=hz; o.connect(g); g.connect(target); o.start();
  if(base!==undefined) target.value=base;
  return o;
}

/* 場所ごとの床。作って繋いだまま、音量だけを行き来させる。 */
function auBed(k){
  if(SNDBUF[BEDSND[k]]) return auLoop(BEDSND[k]);
  var c=AU.ctx, out=auGain(0); out.connect(AU.master);
  if(k==="minato"||k==="asa"){                        // 海。打ち寄せと潮騒の二層
    var s1=auSrc(), f1=c.createBiquadFilter(), g1=auGain(.0);
    f1.type="bandpass"; f1.frequency.value=(k==="asa"?520:380); f1.Q.value=.6;
    s1.connect(f1); f1.connect(g1); g1.connect(out);
    auLfo(.07,.055,g1.gain,.075); auLfo(.113,.03,g1.gain);
    var s2=auSrc(), f2=c.createBiquadFilter(), g2=auGain(.05);
    f2.type="lowpass"; f2.frequency.value=150;
    s2.connect(f2); f2.connect(g2); g2.connect(out);
    var s3=auSrc(), f3=c.createBiquadFilter(), g3=auGain(.018);  // 風
    f3.type="bandpass"; f3.frequency.value=760; f3.Q.value=1.4;
    s3.connect(f3); f3.connect(g3); g3.connect(out);
    auLfo(.041,300,f3.frequency,760);
  } else if(k==="ishi"){                              // 外。海は遠い
    var a=auSrc(), fa=c.createBiquadFilter(), ga=auGain(.03);
    fa.type="bandpass"; fa.frequency.value=300; fa.Q.value=.5;
    a.connect(fa); fa.connect(ga); ga.connect(out); auLfo(.06,.02,ga.gain,.03);
    var w=auSrc(), fw=c.createBiquadFilter(), gw=auGain(.022);
    fw.type="bandpass"; fw.frequency.value=620; fw.Q.value=1.1;
    w.connect(fw); fw.connect(gw); gw.connect(out); auLfo(.037,240,fw.frequency,620);
  } else {                                            // 家の中。低い持続と部屋の空気
    var o1=c.createOscillator(), o2=c.createOscillator(), gd=auGain(k==="butsu"?.035:.026);
    o1.type="sine"; o2.type="sine"; o1.frequency.value=55; o2.frequency.value=55.4;
    o1.connect(gd); o2.connect(gd); gd.connect(out); o1.start(); o2.start();
    var r=auSrc(), fr=c.createBiquadFilter(), gr=auGain(.017);
    fr.type="lowpass"; fr.frequency.value=k==="butsu"?170:240;
    r.connect(fr); fr.connect(gr); gr.connect(out);
    if(k==="butsu") auLfo(.13,.012,gd.gain,.035);     // 蝋燭
  }
  return out;
}


/* ---------- 音楽 ----------
   前は「この夜に音楽は流れていないから旋律は置かない」としていた。**これは間違い。**
   無音が効くのは、鳴っているものを止められるからで、最初から無音では止めようがない。
   ノベルゲームで無音が続くのは、単に死んでいるだけになる。

   都節音階（ニ・変ホ・ト・イ・変ロ）を、一音ずつ、間を空けて置く。旋律は作らない。
   拍もない。音が一つ落ちて、消えるまで待つ。翳りの音が鳴るあいだは下がる。
   music_yoru.mp3 / music_asa.mp3 を置けば、この合成は使わずそちらを流す。 */
var MU={ out:null, dry:null, t:null, set:null, on:true };
var MUSET={
  heya:  { n:[146.83,293.66,311.13,392.00,440.00], gap:[2.4,5.0], v:.075, pad:[146.83,220.00] },
  nami:  { n:[146.83,293.66,392.00,440.00,466.16], gap:[3.0,6.2], v:.062, pad:[146.83,196.00] },
  kaze:  { n:[293.66,311.13,392.00,440.00],        gap:[3.4,6.8], v:.055, pad:[146.83,220.00] },
  asa:   { n:[293.66,392.00,440.00,466.16,587.32], gap:[2.2,4.4], v:.085, pad:[220.00,293.66] }
};
function muStart(){
  if(!AU.ctx || MU.out) return;
  var c=AU.ctx;
  MU.out=auGain(0); MU.dry=auGain(1);
  var d=c.createDelay(1.2), fb=auGain(.34), lp=c.createBiquadFilter();
  lp.type="lowpass"; lp.frequency.value=1600; d.delayTime.value=.44;
  MU.out.connect(MU.dry); MU.dry.connect(AU.master);
  MU.out.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(AU.master);
  MU.out.gain.linearRampToValueAtTime(1, c.currentTime+4);
  /* 持続音。単音だけだと音楽にならず、点が落ちているだけになる */
  MU.pad=[]; 
  for(var i=0;i<2;i++){
    var po=c.createOscillator(), pg=auGain(0);
    po.type="sine"; po.connect(pg); pg.connect(MU.dry); po.start();
    auLfo(.023+i*.017,.011,pg.gain,.026);
    MU.pad.push({o:po,g:pg});
  }
  muNext();
}
function muNote(f,v,dur){
  var c=AU.ctx, t=c.currentTime;
  if(SNDBUF.music_yoru || SNDBUF.music_asa) return;      // 素材があるなら合成は鳴らさない
  var o=c.createOscillator(), o2=c.createOscillator(), g=auGain(0), g2=auGain(.16);
  o.type="sine"; o2.type="sine"; o.frequency.value=f; o2.frequency.value=f*2.004;
  o2.connect(g2); g2.connect(g); o.connect(g);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(v,t+.03);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  g.connect(MU.out); o.start(t); o2.start(t); o.stop(t+dur+.05); o2.stop(t+dur+.05);
}
function muNext(){
  clearTimeout(MU.t);
  var s=MU.set||MUSET.heya;
  var f=s.n[Math.floor(Math.random()*s.n.length)];
  muNote(f, s.v*(.7+Math.random()*.5), 4.5+Math.random()*3);
  if(Math.random()<.22) setTimeout(function(){        // たまに二つ重ねる
    muNote(s.n[Math.floor(Math.random()*s.n.length)], s.v*.5, 4);
  }, 700+Math.random()*900);
  MU.t=setTimeout(muNext, (s.gap[0]+Math.random()*(s.gap[1]-s.gap[0]))*1000);
}
function muPlace(k){
  if(!AU.ctx) return;
  MU.set=MUSET[BEDSND[k]] || MUSET.heya;
  muStart();
  if(MU.pad) MU.pad.forEach(function(x,i){          // 持続音を、その場の音に寄せる
    x.o.frequency.linearRampToValueAtTime(MU.set.pad[i], AU.ctx.currentTime+3.5);
  });
  if(SNDBUF.music_yoru || SNDBUF.music_asa){          // 素材があるほうを流す
    var want = (k==="asa" && SNDBUF.music_asa) ? "music_asa" : "music_yoru";
    if(MU.cur===want) return;
    if(MU.src){ try{ MU.src.stop(AU.ctx.currentTime+2.2); }catch(e){} }
    if(!SNDBUF[want]) { MU.cur=null; return; }
    var b=AU.ctx.createBufferSource(); b.buffer=SNDBUF[want]; b.loop=true;
    var g=auGain(0); b.connect(g); g.connect(AU.master); b.start();
    g.gain.linearRampToValueAtTime(.55, AU.ctx.currentTime+2.2);
    MU.src=b; MU.cur=want;
  }
}
function muDuck(t,down,up){
  if(!MU.dry) return;
  var g=MU.dry.gain;
  g.cancelScheduledValues(t); g.setValueAtTime(g.value,t);
  g.linearRampToValueAtTime(.18,t+down); g.linearRampToValueAtTime(1,t+up);
}

function auPlace(k){
  if(!AU.ctx) return;
  if(AU.now===k) return;
  var t=AU.ctx.currentTime;
  if(AU.now && AU.beds[AU.now]) AU.beds[AU.now].gain.linearRampToValueAtTime(0, t+2.2);
  if(!AU.beds[k]) AU.beds[k]=auBed(k);
  AU.beds[k].gain.cancelScheduledValues(t);
  AU.beds[k].gain.linearRampToValueAtTime(1, t+2.2);
  AU.now=k;
  muPlace(k);
}

/* 一度きりの音。名前は鳴るものの名前にする。 */
function auSE(k){
  if(!AU.ctx||!AU.on) return;
  var c=AU.ctx, t=c.currentTime;
  if(SNDBUF[k]){                                         // 素材があればそちらを鳴らす
    var b=c.createBufferSource(); b.buffer=SNDBUF[k];
    var bg=auGain(1); b.connect(bg); bg.connect(AU.master); b.start(t); return;
  }
  if(k==="eran"){                                     // 選んだ合図。木より高く、短く
    var eo=c.createOscillator(), eg=auGain(0);
    eo.type="triangle";
    eo.frequency.setValueAtTime(520,t); eo.frequency.exponentialRampToValueAtTime(392,t+.06);
    eg.gain.setValueAtTime(.075,t); eg.gain.exponentialRampToValueAtTime(.0001,t+.16);
    eo.connect(eg); eg.connect(AU.master); eo.start(t); eo.stop(t+.18);
    var ee=c.createOscillator(), eeg=auGain(0);       // 一つ上に薄く重ねて、木の粒を出す
    ee.type="sine"; ee.frequency.value=1046;
    eeg.gain.setValueAtTime(.022,t); eeg.gain.exponentialRampToValueAtTime(.0001,t+.07);
    ee.connect(eeg); eeg.connect(AU.master); ee.start(t); ee.stop(t+.09);
  } else if(k==="ki"){                                // 木。移動と決定
    var o=c.createOscillator(), g=auGain(0);
    o.type="triangle"; o.frequency.setValueAtTime(340,t); o.frequency.exponentialRampToValueAtTime(180,t+.05);
    g.gain.setValueAtTime(.10,t); g.gain.exponentialRampToValueAtTime(.0001,t+.09);
    o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+.1);
  } else if(k==="okuri"){                             // 送り。行が入れ替わった合図
    if(SKIP) return;                                  // 早送り中は鳴らさない
    /* 毎行鳴るので、いちばん小さく短く。木を爪で弾いたくらい。
       速く連打されたときに音が積み上がらないよう、前の一つを消してから鳴らす。 */
    if(AU.ok && AU.okt>t-.045) return;
    AU.ok=1; AU.okt=t;
    var oo=c.createOscillator(), og=auGain(0);
    oo.type="triangle";
    oo.frequency.setValueAtTime(1180,t); oo.frequency.exponentialRampToValueAtTime(620,t+.03);
    og.gain.setValueAtTime(.028,t); og.gain.exponentialRampToValueAtTime(.0001,t+.055);
    oo.connect(og); og.connect(AU.master); oo.start(t); oo.stop(t+.07);
    var sn=auSrc(), fn=c.createBiquadFilter(), gn=auGain(0);   // 紙の縁が擦れるぶん
    fn.type="bandpass"; fn.frequency.value=2600; fn.Q.value=1.2;
    gn.gain.setValueAtTime(.022,t); gn.gain.exponentialRampToValueAtTime(.0001,t+.045);
    sn.connect(fn); fn.connect(gn); gn.connect(AU.master);
    setTimeout(function(){ try{sn.stop();}catch(e){} },80);
  } else if(k==="kami"){                              // 紙。剥がす、置く
    var s=auSrc(), f=c.createBiquadFilter(), g2=auGain(0);
    f.type="highpass"; f.frequency.value=2200;
    g2.gain.setValueAtTime(.0001,t);
    g2.gain.exponentialRampToValueAtTime(.075,t+.06);
    g2.gain.exponentialRampToValueAtTime(.0001,t+.34);
    s.connect(f); f.connect(g2); g2.connect(AU.master);
    setTimeout(function(){ try{s.stop();}catch(e){} },420);
  } else if(k==="ko"){                                // 線香が一本尽きる
    var o3=c.createOscillator(), g3=auGain(0);
    o3.type="sine"; o3.frequency.setValueAtTime(196,t); o3.frequency.exponentialRampToValueAtTime(132,t+.3);
    g3.gain.setValueAtTime(.085,t); g3.gain.exponentialRampToValueAtTime(.0001,t+.55);
    o3.connect(g3); g3.connect(AU.master); o3.start(t); o3.stop(t+.6);
  } else if(k==="fusuma"){                            // 襖。乾いた糊と溝
    var s4=auSrc(), f4=c.createBiquadFilter(), g4=auGain(0);
    f4.type="bandpass"; f4.frequency.setValueAtTime(420,t); f4.frequency.linearRampToValueAtTime(1500,t+.7); f4.Q.value=.8;
    g4.gain.setValueAtTime(.0001,t);
    g4.gain.exponentialRampToValueAtTime(.09,t+.18);
    g4.gain.exponentialRampToValueAtTime(.0001,t+.9);
    s4.connect(f4); f4.connect(g4); g4.connect(AU.master);
    setTimeout(function(){ try{s4.stop();}catch(e){} },1000);
  } else if(k==="kage"){                              // 翳り。場面が変わる一行に
    var d1=c.createOscillator(), d2=c.createOscillator(), gk=auGain(0);
    d1.type="sine"; d2.type="sine";
    d1.frequency.setValueAtTime(58,t);  d1.frequency.linearRampToValueAtTime(55,t+2.2);
    d2.frequency.setValueAtTime(58.9,t); d2.frequency.linearRampToValueAtTime(54.4,t+2.2);
    gk.gain.setValueAtTime(.0001,t);
    gk.gain.exponentialRampToValueAtTime(.075,t+.5);
    gk.gain.exponentialRampToValueAtTime(.0001,t+2.3);
    d1.connect(gk); d2.connect(gk); gk.connect(AU.master);
    d1.start(t); d2.start(t); d1.stop(t+2.4); d2.stop(t+2.4);
    var s5=auSrc(), f5=c.createBiquadFilter(), g5=auGain(0);   // 息をのむ帯域
    f5.type="bandpass"; f5.frequency.setValueAtTime(1200,t);
    f5.frequency.exponentialRampToValueAtTime(320,t+1.6); f5.Q.value=2.4;
    g5.gain.setValueAtTime(.0001,t); g5.gain.exponentialRampToValueAtTime(.03,t+.35);
    g5.gain.exponentialRampToValueAtTime(.0001,t+1.8);
    s5.connect(f5); f5.connect(g5); g5.connect(AU.master);
    setTimeout(function(){ try{s5.stop();}catch(e){} },2000);
    muDuck(t,.45,2.8);                                        // 音楽も引く
    if(AU.now && AU.beds[AU.now]){                            // 部屋が息を止める
      var bg=AU.beds[AU.now].gain;
      bg.cancelScheduledValues(t);
      bg.setValueAtTime(bg.value,t);
      bg.linearRampToValueAtTime(.35,t+.45);
      bg.linearRampToValueAtTime(1,t+2.6);
    }
  } else if(k==="omo"){                               // 重い一打。この夜の要になる一行に
    muDuck(t,.5,4.6);
    [1,2.02,3.01,4.94].forEach(function(m,i){         // 低く撞いた鐘。倍音を濁らせる
      var o6=c.createOscillator(), g6=auGain(0);
      o6.type="sine"; o6.frequency.setValueAtTime(98*m,t);
      o6.frequency.linearRampToValueAtTime(98*m*.995,t+3.2);
      g6.gain.setValueAtTime(.0001,t);
      g6.gain.exponentialRampToValueAtTime(.075/(i*.9+1),t+.02);
      g6.gain.exponentialRampToValueAtTime(.0001,t+3.4-i*.5);
      o6.connect(g6); g6.connect(AU.master); o6.start(t); o6.stop(t+3.6);
    });
    var s6=auSrc(), f6=c.createBiquadFilter(), g7=auGain(0);   // 撞いた瞬間の木
    f6.type="bandpass"; f6.frequency.value=1400; f6.Q.value=1.1;
    g7.gain.setValueAtTime(.05,t); g7.gain.exponentialRampToValueAtTime(.0001,t+.09);
    s6.connect(f6); f6.connect(g7); g7.connect(AU.master);
    setTimeout(function(){ try{s6.stop();}catch(e){} },140);
    if(AU.now && AU.beds[AU.now]){                    // 部屋も一度だけ息を止める
      var bo=AU.beds[AU.now].gain;
      bo.cancelScheduledValues(t); bo.setValueAtTime(bo.value,t);
      bo.linearRampToValueAtTime(.30,t+.4);
      bo.linearRampToValueAtTime(1,t+3.8);
    }
  } else if(k==="rin"){
    muDuck(t,.6,6.5);                               // 鈴。第四封が開いた人だけが聞く
    [1,2.76,5.4,8.9].forEach(function(m,i){
      var o5=c.createOscillator(), g5=auGain(0);
      o5.type="sine"; o5.frequency.value=294*m;
      g5.gain.setValueAtTime(.055/(i+1),t+.004*i);
      g5.gain.exponentialRampToValueAtTime(.0001,t+5.5-i*.9);
      o5.connect(g5); g5.connect(AU.master); o5.start(t); o5.stop(t+6);
    });
  }
}

function auStart(){
  if(AU.ctx) return;
  try{ AU.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  AU.master=auGain(AU.on?.55:0); AU.master.connect(AU.ctx.destination);
  auDecode();
}
function auDraw(){
  var b=$("bau"); if(b) b.classList.toggle("off",!AU.on);
  if(AU.master) AU.master.gain.linearRampToValueAtTime(AU.on?.55:0, AU.ctx.currentTime+.25);
  try{ localStorage.setItem("oto",AU.on?"1":"0"); }catch(e){}
}

STEPS.forEach(function(v){
  var i=document.createElement("i");
  if(v===1000||v===10000||v===100000||v===1000000) i.classList.add("edge");
  if(v===PAYFROM) i.classList.add("pay");     // ここからお支払いが始まる
  $("ladder").appendChild(i);
});
/* ---------- 題と説明 ----------
   画面は一枚ずつ。頁の中を送らせない（本文の窓だけが中で送る）。 */
function scene(k){

    $(n).classList.toggle("on", n===k);
  });
}

var INTRO=[
  { t:"包む額のこと", rows:[
    ["一","上限は <b>金百万円</b>。お支払いで <b>¥10,000</b> です。"],
    ["二","この町の金は、あなたの<b>百倍</b>。<b>金九千円までは、お支払いがありません。</b>"],
    ["三","返金はありません。始まったあと、足すこともできません。"],
    ["四","この先、金額はすべて<b>この町の金</b>で書かれます。精算書も、封の値段も。"]
  ]},
  { t:"この夜のこと", rows:[
    ["線香","一本尽きるごとに夜が進みます。尽きたら朝が来て、通夜は終わります。"],
    ["歩く","家と港のあいだは自由に行き来できます。歩くのにも、読み直すのにも線香は要りません。"],

/* 一行ずつ窓に出す。送りは窓のどこを押しても効く。ただし指せる語句の上だけは
   送らずに「控える」に回る。下線もカーソル変化も出さないので、押した本人にしか
   起きたことが分からない（SPEC 3.5 A）。 */
var Q={ list:[], i:0, end:null, tid:null, chars:[], k:0, hold:false, cur:null, fast:false };
/* 間を置く。早送りと検証のときは置かない */
var DEVFAST=false;
function wait(ms,fn){ if(SKIP||DEVFAST||Q.fast){ fn(); return; } setTimeout(fn,ms); }
var REDUCE = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function say(list,onEnd){
  Q.list=list.slice(); Q.i=0; Q.end=onEnd||function(){};
  $("nav").replaceChildren();
  nextLine();
}

/* 名札。「」で始まる行だけに出す。表に無ければ汐里。
   src を持たない行（封・購入の本文）には出さない。帳の声に名札は付かない。 */
function speakerOf(it){
  if(it.who) return it.who;
  if(!it.t || it.t.charAt(0)!=="「") return null;
  if(!it.src) return null;
  return (SPEAK[it.src]||{})[it.id] || "汐里";
}

/* ふりがな。原稿には埋め込まない。描いた HTML の、札の外側だけを走査して包む。
   辞書は語の表記から引き、長いものを先に当てる。読みは漢字の連なりごとに | で区切ってある。 */
var RUBYON=true, RBIX=null;
var KJ=/[\u4e00-\u9fff々〆ヶ]/;
function rbIndex(){
  if(RBIX) return RBIX;
  RBIX={};
  Object.keys(RUBY).forEach(function(k){ (RBIX[k.charAt(0)]=RBIX[k.charAt(0)]||[]).push(k); });
  Object.keys(RBIX).forEach(function(c){ RBIX[c].sort(function(a,b){ return b.length-a.length; }); });
  return RBIX;
}
function rubyWord(k){
  var v=RUBY[k].split("|"), out="", i=0, j=0;
  while(i<k.length){
    if(KJ.test(k.charAt(i))){
      var s=i; while(i<k.length && KJ.test(k.charAt(i))) i++;
      out+="<ruby>"+k.slice(s,i)+"<rt>"+(v[j++]||"")+"</rt></ruby>";
    } else out+=k.charAt(i++);
  }
  return out;
}
function addRuby(html){
  if(!RUBYON) return html;
  var ix=rbIndex(), parts=html.split(/(<[^>]*>)/), out="";
  for(var p=0;p<parts.length;p++){
    if(p%2===1){ out+=parts[p]; continue; }          // 札には触らない
    var s=parts[p], i=0;
    while(i<s.length){
      var list=ix[s.charAt(i)], hit=null;
      if(list) for(var n=0;n<list.length;n++){ if(s.substr(i,list[n].length)===list[n]){ hit=list[n]; break; } }
      if(hit){ out+=rubyWord(hit); i+=hit.length; } else out+=s.charAt(i++);
    }
  }
  return out;
}

/* 語注。買える語句の札の中には入れない（指すのと押すのがぶつかる）。
   ふりがなより先に当てる。ふりがなは札の外だけを走るので、順番はこれでいい。 */
var GLIX=null;
/* 呼びかけが続く語は人の名前。凪さん に「風がやんで波が静かになること」は出さない。
   凪いだ海 のほうには出る。 */
var HON=["さん","様","ちゃん","くん","君"];
function isName(rest){
  for(var i=0;i<HON.length;i++) if(rest.indexOf(HON[i])===0) return true;
  return false;
}
function glIndex(){
  if(GLIX) return GLIX;
  GLIX={};
  Object.keys(GLOSS).forEach(function(k){ (GLIX[k.charAt(0)]=GLIX[k.charAt(0)]||[]).push(k); });
  Object.keys(GLIX).forEach(function(c){ GLIX[c].sort(function(a,b){ return b.length-a.length; }); });
  return GLIX;
}
/* 「…」のあとに地の文が続く行が六つある。詰めて出すと一続きに読めてしまうので、
   字と字のあいだを少し空ける。文そのものは変えない（記録も数えも動かさない）。 */
function qgap(html){ return html.replace(/」(?![」』、。）\s]|$)/g, '」<i class="qg"></i>'); }

function addGloss(html){
  var ix=glIndex(), parts=html.split(/(<[^>]*>)/), out="", depth=0;
  for(var p=0;p<parts.length;p++){
    if(p%2===1){                                   // 札。指せる語句の中に入ったら数える
      if(/^<span[^>]*class="[^"]*ask/.test(parts[p])) depth++;
      else if(depth && /^<\/span>/.test(parts[p])) depth--;
      out+=parts[p]; continue;
    }
    if(depth){ out+=parts[p]; continue; }
    var t=parts[p], i=0;
    while(i<t.length){
      var list=ix[t.charAt(i)], hit=null;
      if(list) for(var n=0;n<list.length;n++){ if(t.substr(i,list[n].length)===list[n]){ hit=list[n]; break; } }
      if(hit && isName(t.slice(i+hit.length))) hit=null;   // 人の名前には出さない
      if(hit){ out+='<span class="gl" data-g="'+hit+'">'+hit+'</span>'; i+=hit.length; }
      else out+=t.charAt(i++);
    }
  }
  return out;
}

/* 押した語の上に、辞書の意味だけを出す。作品の側の意味は書かない */
function glShow(el){
  var w=el.getAttribute("data-g"), b=$("glbox");
  if(!GLOSS[w]) return;
  b.querySelector(".w").textContent=w;
  b.querySelector(".d").textContent=GLOSS[w];
  b.classList.add("on");
  var r=el.getBoundingClientRect(), bb=b.getBoundingClientRect();
  var x=Math.min(Math.max(8, r.left+r.width/2-bb.width/2), innerWidth-bb.width-8);
  var y=r.top-bb.height-10;
  if(y<8) y=r.bottom+10;
  b.style.left=x+"px"; b.style.top=y+"px";
}
function glHide(){ $("glbox").classList.remove("on"); }

function nextLine(){
  if(Q.i>=Q.list.length){
    /* 場面の終わりは、どの道もここを通る。段に届いていたら、ここで並べ直す。
       締めの callback はそのまま残るので、話の流れは変わらない。 */
    var sq=S.ended ? null : snagDue();
    if(sq){ Q.list=sq; Q.i=0; nextLine(); return; }
    $("tri").classList.remove("on");                    // 最後の一行は窓に残す
    var e=Q.end; Q.end=function(){}; Q.list=[]; Q.i=0;   // 締めは一度だけ焚く
    e(); return;
  }
  var it=Q.list[Q.i++];
  if(it.gap){                                   // 間。本文では「また、間。」と書いてある所を、実際に止める
    $("tri").classList.remove("on");
    wait(it.gap, nextLine);
    return;
  }
  if(it.brk){                                   // 場面の途中。ここにいる相手と話せる
    var av=S.incense>0 ? TALK.filter(function(x){ return x.place===it.brk && !S.talked[x.k]; }) : [];
    if(!av.length){ nextLine(); return; }
    $("win").classList.remove("on");
    var back=Q.list, bi=Q.i, bend=Q.end;        // 読みかけを覚えておいて、話し終えたら戻る
                                                // 締め（Q.end）も一緒に。say が上書きするため
    menu([["話す\n線香を一本", av.map(function(x){
      return [x.label, function(){
        S.talked[x.k]=true;
        say(talkLines(x).concat([ashLine()]), function(){
          if(!burn()){ Q.list=back; Q.i=bi; Q.end=bend; $("nav").replaceChildren(); nextLine(); }
        });
      }];
    })], ["", [["読み進める", function(){ $("nav").replaceChildren(); nextLine(); }]], "sub"]]);
    return;
  }
  if(it.act){                                   // 手を動かすところ。話は分岐しない
    $("win").classList.remove("on");
    /* どちらを選んでも先へ進む。前は片方が必ず同じ選択肢に戻ってきたので、
       戻るほうが「押しても何も起きない側」だと分かってしまい、選ぶ意味が消えていた。
       出来事は動かないという規則は変えない。変わるのは、通る文だけ。 */
    var A=it.act;
    var opts=[[A.go, function(){ $("nav").replaceChildren(); nextLine(); }]];
    if(A.alt) opts.push([A.alt, function(){
      var back=Q.list, bi=Q.i, bend=Q.end;
      $("nav").replaceChildren();
      say(A.lines.map(function(x){ return { t:x }; }), function(){
        Q.list=back; Q.i=bi; Q.end=bend;        // 読んでから、そのまま先へ
        nextLine();
      });
    }]);
    choices(opts);
    return;
  }
  if(it.card){                                  // 領収書・精算書。窓を閉じて札だけ見せる
    $("card").replaceChildren(it.card());
    $("win").classList.remove("on");
    Q.hold=true; $("game").classList.add("wait"); stopAuto();
    return;
  }
  $("win").classList.add("on");
  Q.cur=it;                                   // いま出ている行。ふりがなの切り替えで引き直す
  var w=$("who"), nm=speakerOf(it);
  if(nm){ w.textContent=nm; w.hidden=false; } else { w.hidden=true; }
  if(it.bg) setArt(it.bg);
  if(it.se) auSE(it.se);
  else if(it.src && (MARK[it.src]||{})[it.id]) auSE(MARK[it.src][it.id]);
  $("wt").className="win-t"+(it.cls?" "+it.cls:"");
  glHide();
  auSE("okuri");                                // 行が入れ替わる合図。自動送りでも鳴る
  logPush(it); markSeen(it.t);
  var html=esc(it.t);
  if(it.id) html=markAsks(it.src,it.id,html);
  type(addRuby(addGloss(qgap(html))));
}

/* 一字ずつ出す。字を <i> に割ってから透かす。指せる語句の span は壊さない。 */
/* 枠に入り切らない行は、入るところまで字を詰める。それでも溢れるときだけ中で送る */
/* 読む人によって、ちょうどいい大きさは違う。設定で三段だけ変えられるようにする */
var TXTZ=1;
try{ var _tz=parseFloat(localStorage.getItem("choba.txt")); if(_tz>0) TXTZ=_tz; }catch(e){}
function setTxtZ(z){
  TXTZ=z;
  document.documentElement.style.setProperty("--txtz", String(z));
  try{ localStorage.setItem("choba.txt", String(z)); }catch(e){}
}
setTxtZ(TXTZ);

function winFit(){
  var el=$("wt");
  el.style.fontSize="";
  var s=[1.22,1.16,1.10,1.04,.98,.93,.88].map(function(x){ return x*TXTZ; });
  for(var i=0;i<s.length;i++){
    el.style.fontSize=s[i]+"rem";
    if(el.scrollHeight<=el.clientHeight+1) return;
  }
}

function type(html){
  var el=$("wt"); el.innerHTML=html;
  (function split(n){
    for(var i=n.childNodes.length-1;i>=0;i--){
      var c=n.childNodes[i];
      if(c.nodeType===3){
        var f=document.createDocumentFragment();
        c.nodeValue.split("").forEach(function(ch){
          var s=document.createElement("i"); s.className="c"; s.textContent=ch; f.appendChild(s);
        });
        n.replaceChild(f,c);
      } else if(c.nodeType===1){
        if(c.tagName==="RT"){                       // 読みは一度で出す
          var w=document.createElement("i"); w.className="c"; w.textContent=c.textContent;
          c.replaceChildren(w);
        } else split(c);
      }
    }
  })(el);
  winFit();
  Q.chars=Array.prototype.slice.call(el.querySelectorAll("i.c")); Q.k=0;
  clearInterval(Q.tid); Q.tid=null;
  $("tri").classList.remove("on");
  if(REDUCE||SKIP){ revealAll(); return; }
  Q.chars.forEach(function(s){ s.style.opacity="0"; });
  Q.tid=setInterval(function(){
    if(Q.k>=Q.chars.length){ revealAll(); return; }
    Q.chars[Q.k++].style.opacity="1";
  },17);
}
function revealAll(){
  clearInterval(Q.tid); Q.tid=null;
  Q.chars.forEach(function(s){ s.style.opacity="1"; });
  $("tri").classList.add("on");
  afterLine();
}

     !(e&&e.target&&e.target.closest&&e.target.closest(".gl"))){ glHide(); return; }

/* ---------- 引っかかり ----------
   夜のあいだに実際に読んだ行だけを、あとで並べ直す。新しい事実は足さない。
   だから何を見たかで中身が変わり、しかも矛盾のしようがない。
   並べるところまでで、結論は書かない。結論は封が言う。 */
var SNAGX=null;
function snagIndex(){
  if(SNAGX) return SNAGX;
  SNAGX={};
  SNAG.forEach(function(x){ SNAGX[x.src+"/"+x.id]=x; });
  return SNAGX;
}
function snagCatch(it){
  if(!it || !it.id) return;
  var x=snagIndex()[(it.src||"")+"/"+it.id];
  if(x && !S.snag[x.k]) S.snag[x.k]=true;
}
function snagCount(){ return Object.keys(S.snag).length; }

/* 段に届いたら一度だけ。歩くときと、夜が明ける前に見る */
function snagDue(){
  var n=snagCount(), got=null;
  SNAGT.forEach(function(t){ if(n>=t.n && !S.snagT[t.n]) got=t; });
  if(!got) return null;
  S.snagT[got.n]=true;
  /* 途中の段は、前に並べたものを繰り返さない。最後の段だけ、頭から並べ直す */
  var last = SNAGT.length && SNAGT[SNAGT.length-1].n===got.n;
  var q=[{ t:got.head, cls:"aside" }];
  SNAG.forEach(function(x){
    if(!S.snag[x.k]) return;
    if(!last && S.snagShown[x.k]) return;
    S.snagShown[x.k]=true;
    q.push({ t:x.t, cls:"aside" });
  });
  var lv=String(Math.min(5, S.band+1));
  var tail=got.tail[lv];
  for(var i=Number(lv); i>=1 && !tail; i--) tail=got.tail[String(i)];
  q.push({ t:tail, cls:"aside", se:"kage" });
  return q;
}

/* 読み返し。遡及の書き換えは、戻って読み直したときにだけ見える。 */
function logPush(it){
  snagCatch(it);
  S.log.push({t:it.t, who:speakerOf(it), src:it.src||null, id:it.id||null});
  if(S.log.length>900) S.log.shift();
}

/* その行が、ほかの額では別の文になるか。
   **どう変わるかは絶対に見せない。** 位置と数だけ。中身を見せると、
   払わずに上の帯が読めてしまい、この作品の売り物が消える。 */
function isVar(src,id){
  if(!src||!id) return false;
  if(src==="7"){
    var v=CH7.lines[id]; if(!v) return false;
    for(var k in v){ if(Object.keys(v[k]).length>1) return true; }
    return false;
  }
  var C=CH[src]; return !!(C && C.ov && C.ov[id]);
}
function openLog(){
  var l=$("loglist"); l.replaceChildren();
  var n=0, v=0;
  S.log.forEach(function(x){ n++; if(isVar(x.src,x.id)) v++; });
  /* 夜が明けて結末まで行った人にだけ、書き換わった行の位置を示す口を出す。
     読んでいる最中に出すと、どこに仕掛けがあるかを先に教えてしまう。 */
  if(S.ended && v){
    var h=document.createElement("div"); h.className="log-h";
    h.innerHTML='<p>この夜、あなたは'+kan(n)+'行を読みました。<br>'+
      'そのうち<b>'+kan(v)+'行</b>は、ほかの額では別の文になります。</p>'+
      '<label><input type="checkbox" id="logmk"'+(S.logMk?" checked":"")+'> その行に印を付ける</label>'+
      '<p class="log-n">どう変わるかは、その額を包んだときにしか読めません。</p>';
    l.appendChild(h);
    h.querySelector("#logmk").addEventListener("click",function(e){ e.stopPropagation(); });
    h.querySelector("#logmk").addEventListener("change",function(){ S.logMk=this.checked; openLog(); });
    h.addEventListener("click",function(e){ e.stopPropagation(); });
  }
  S.log.forEach(function(x){
    var mk = S.ended && S.logMk && isVar(x.src,x.id);
    if(x.who){ var w=document.createElement("p"); w.className="w"+(mk?" v":""); w.textContent=x.who; l.appendChild(w); }
    var p=document.createElement("p"); p.className="l"+(mk?" v":""); p.textContent=x.t; l.appendChild(p);
  });
  $("logbox").classList.add("on"); $("logclose").hidden=false;
  $("logbox").scrollTop = S.ended ? 0 : $("logbox").scrollHeight;   // 終わったあとは頭から
}

/* 会話の本文。帯の書き換えは章と同じ当て方をする。 */
function talkLines(t){

/* 章の札。初めて入った章だけ真ん中に出す。歩いて戻ったときは上の一行だけ。
   触れば飛ばせる。読みは札が消えてから始まる。 */
var CARD={ t:[], go:null };
function chapCard(s, cb){
  chapTitle(s);
  if(S.seenChap[s]){ cb(); return; }
  S.seenChap[s]=true;
  var p=s.split("　"), el=$("chapcard");
  el.querySelector(".cc-n").textContent=p[0]||"";
  el.querySelector(".cc-t").textContent=p[1]||"";
  $("win").classList.remove("on"); $("nav").replaceChildren();
  el.classList.add("on"); void el.offsetWidth; el.classList.add("in");
  CARD.go=function(){
    CARD.t.forEach(clearTimeout); CARD.t=[];
    var f=CARD.go; CARD.go=null;
    el.classList.remove("in");
    setTimeout(function(){ el.classList.remove("on"); }, 900);
    cb();
  };
  CARD.t.push(setTimeout(function(){ if(CARD.go) CARD.go(); }, SKIP?200:4600));
}
function chapSkip(){ if(CARD.go){ CARD.go(); return true; } return false; }
$("chapcard").addEventListener("click",function(e){ e.stopPropagation(); chapSkip(); });

function chapTitle(s){
  var c=$("chap"); c.textContent=s;
  c.classList.remove("in"); void c.offsetWidth; c.classList.add("in");
}

function enter(k, done){
  S.place=k;
  var P=PLACES.filter(function(p){return p.k===k;})[0];
  $("place").textContent=P.name;
  $("card").replaceChildren();
  setArt(PLACEBG[k]); auPlace(k); auSE("ki");
  /* 一度通した章は、戻ってきても最初から流さない。
     戸を開け直したり、名前を書き直したりすることになって、進み具合と食い違うため。
     読み直したい人には、選択肢の一番下に「もう一度読む」を置く。 */
  var then = done || drawNav;
  if(S.readCh[P.src]){ chapTitle(P.ch); then(); return; }
  chapCard(P.ch, function(){ say(chapQueue(P, true), function(){ S.readCh[P.src]=true; then(); }); });
}

/* 章の行を並べる。first のときだけ、手を動かすところと立ち止まりを混ぜる */
function chapQueue(P, first){
  var at=BGAT[P.src]||{}, q=[], A1=ACTS[P.src]||{}, BRK=(BREAK[P.src]||[]);
  if(P.opens) S.opened=true;
  (CH[P.src]||{order:[]}).order.forEach(function(id){
    if(first && A1[id]){
      var a=A1[id];
      if(P.src==="1" && id==="L042" && S.paid===0) a={go:"鞄から手を出す", alt:a.alt, lines:a.lines};
      q.push({act:a, src:P.src, id:id});
    }
    q.push({ t:chText(P.src,id), src:P.src, id:id, bg:at[id] });
    if(first && BRK.indexOf(id)>=0) q.push({brk:P.k});
  });
  /* 章の終わりの引き。閉じたまま終わると、次を読む理由が消える。一度目だけ */
  if(first && HOOKS[P.src]) HOOKS[P.src].forEach(function(x){ q.push(x); });
  return q;
}

/* 選択肢はひとつの札にまとめる。絵に重なるのは出ているあいだだけ。 */
function menu(rows){
  setAuto(false); setSkip(false); stopAuto();
  var n=$("nav"); n.replaceChildren();
  var m=document.createElement("div"); m.className="menu";
  /* 見出しがどの段にも無いとき（一手だけの選択肢や確認）は、見出しの幅を取らない。
     取ると、ボタンだけが右に寄って、真ん中からずれて見える。 */
  var anyLabel = rows.some(function(r){ return r[0]; });
  if(!anyLabel) m.classList.add("plain");
  rows.forEach(function(r){
    if(!r[1].length) return;
    var row=document.createElement("div"); row.className="row"+(r[2]?" "+r[2]:"");
    var l=document.createElement("div"); l.className="row-l";
    if(!anyLabel) l.hidden=true;
    var lab=String(r[0]).split("\n");
    l.textContent=lab[0];
    if(lab[1]){ var s=document.createElement("small"); s.textContent=lab[1]; l.appendChild(s); }
    var a=document.createElement("div"); a.className="acts";
    r[1].forEach(function(x){
      var b=document.createElement("button"); b.type="button"; b.textContent=x[0];
      if(x[2]) b.className="here";
      if(x[3]===false) b.disabled=true;
      else b.addEventListener("click",function(ev){ auSE("eran"); x[1](ev); });
      a.appendChild(b);
    });
    row.appendChild(l); row.appendChild(a); m.appendChild(row);
  });
  n.appendChild(m);
}
function choices(list){
  menu([["", list.map(function(x){ return [x[0], x[1], false, x[2]]; })]]);
}

function stubEl(A){
  auSE("kami");
  var w=document.createElement("div"); w.className="stub";
  var n=Object.keys(S.bought).length, bars="";
  for(var i=0;i<n;i++) bars+="│";
  w.innerHTML='<div class="stub-in">芳名帳　内引<br>'+(A.item||'——')+'<br>'+
              '<span class="amt2">金 ■■■ 円</span>'+
              '<div class="tally">'+bars+'</div></div>';
  return w;
}

/* ---------- 訊く ----------
   訊くのは章の途中でも起きる。終わったあと drawNav に落としていたので、
   その章の残りが捨てられ、もう一度その場へ入ると最初から流れ直していた。
   入る前の列を覚えておいて、続きへ戻す。 */
var OBACK=null, OFFING=false;
function afterOffer(){
  OFFING=false;
  if(OBACK){ var b=OBACK; OBACK=null; Q.list=b.list; Q.i=b.i; Q.end=b.end; nextLine(); return; }
  S.done ? corridor() : drawNav();
}
function offer(k){
  if(OFFING) return;                      // 訊いている最中に、次を重ねない
  OFFING=true;
  var A=ASKS[k], price=priceOf(A.tier);
  OBACK = (Q.list.length && Q.i<Q.list.length) ? { list:Q.list, i:Q.i, end:Q.end } : null;

  /* ¥0 には購入UIを一切出さない。値も、買うか否かの選択肢も、買えないという表示も出さない。
     帳場さんが一言だけ言って帳を閉じる。帯1の本文はこれを気遣いとして受け取る。 */
  if(S.paid===0){
    say([{t:"「お持ちでないようで」", who:"帳場さん"}], function(){
      delete S.noted[k];
      document.querySelectorAll('.ask[data-k="'+k+'"]').forEach(function(e2){ e2.classList.add("used"); });
      afterOffer();
    });
    return;
  }

  say([{t:A.say, who:"帳場さん"}], function(){
    choices([
      ["訊く", function(){ take(k); }, balance()>=price],
      ["やめておく", afterOffer]
    ]);
  });
}

function take(k){
  var A=ASKS[k];
  S.bought[k]=true; S.spent+=priceOf(A.tier); drawNoteN();
  document.querySelectorAll('.ask[data-k="'+k+'"]').forEach(function(e2){ e2.classList.add("used"); });
  if(S.done) S.lastAsk=false;
  var q=[{card:function(){ return stubEl(A); }}];
  A.fact.split("|").forEach(function(t){ q.push({t:t}); });
  /* 残高は見せない。減ってきたことを、額ではなく態度で一度だけ伝える（骨格6の警告）。
     これが無いと、チキンレースが夜のあいだ一度も体に来ない。 */
  if(S.paid>0 && !S.warned && balance() < S.paid*0.25){
    S.warned=true;
    q.push({ gap:900 });
    q.push({ t:"帳場さんは、湯呑みを置いた。", se:"kage" });
    q.push({ t:"「……そろそろ、お控えになったほうが」", who:"帳場さん" });
    q.push({ t:"額は、言わなかった。" });
  }
  say(q, function(){
    $("card").replaceChildren();
    if(burn()){ OBACK=null; OFFING=false; return; }   // 線香が尽きたら夜が明ける
    afterOffer();                            // 買ったあとも、その場の続きへ戻る
  });
}

/* ---------- 移動と会話 ---------- */
/* 選択肢の段を三つに分ける。重さの違うものを同じ形で並べない。
   上：線香を使うもの（戻せない）／中：歩く（線香は要らない、戻せる）／
   下：閉じる。夜を終える手は仏間にしか置かない（横になる、という一手にする）。 */
/* その場の話が終わっていないうちは、手を出させない。
   途中で歩くと、戻ったときに最初から流れ直して、同じ行を二度読むことになる。
   途中で夜を終えると、その場面ごと落ちる。場面は必ず終わるので、行き止まりにはならない。 */
function reading(){
  if(S.done) return false;
  var P=PLACES.filter(function(p){ return p.k===S.place; })[0];
  return !!(P && !S.readCh[P.src]);
}

function drawNav(){
  if(S.done){ $("nav").replaceChildren(); return; }
  var rows=[];

  if(S.place==="cha"){
    var pend=Object.keys(S.noted).filter(function(k){ return !S.bought[k]; });
    rows.push(["訊く\n線香一本と、帳に", (S.incense>0?pend:[]).map(function(k){
      return ["「"+ASKS[k].phrase+"」のこと", function(){ offer(k); }];
    })]);
  }
  var here=S.incense>0 ? TALK.filter(function(t){ return t.place===S.place && !S.talked[t.k]; }) : [];
  var mk1=function(t){
    return [t.label, function(){
      S.talked[t.k]=true;
      say(talkLines(t).concat([ashLine()]), function(){ if(!burn()) drawNav(); });
    }];
  };
  /* 人に訊くのと、自分で見るのを分ける。同じ段に七つ並べると、何の場面か見えなくなる */
  rows.push(["人に訊く\n線香を一本", here.filter(function(t){ return t.who; }).map(mk1)]);
  rows.push(["自分で見る\n線香を一本", here.filter(function(t){ return !t.who; }).map(mk1)]);
  /* 行き先は一段奥に置く。ここに五つ並べると、何を選ぶ場面なのかが見えなくなる。
     いま居る場所へは歩けないので、そもそも出さない。
     **その場の話が終わっていないうちは歩かせない。** 途中で出ると、戻ったときに
     その場が最初から流れ直して、一度読んだ行をもう一度読むことになる。 */
  var mid=reading();
  if(!mid) rows.push(["", [["ほかの場所へ", walkMenu]], "sub"]);
  /* 夜を終える手はどこからでも届かないと、行き止まりが作れてしまう。
     ただし段は一番下に置いて、話すや歩くと同じ形にはしない。 */
  var P0=PLACES.filter(function(p){return p.k===S.place;})[0];
  var tail=[];
  if(P0 && S.readCh[P0.src]) tail.push(["もう一度読む", function(){
    $("nav").replaceChildren();
    say(chapQueue(P0, false), drawNav);          // 手を動かすところと立ち止まりは出さない
  }]);
  tail.push([S.place==="butsu" ? "横になる" : "夜を終える", askDawn]);
  tail.push(["閉じる", function(){ $("nav").replaceChildren(); }]);
  rows.push(["", tail, "faint"]);
  menu(rows);
  saveNow();                                   // 場面の切れ目。ここだけを控える
  var pend0=Object.keys(S.noted).filter(function(k){ return !S.bought[k]; }).length;
  if(pend0 && S.place!=="cha"){
    var n2=document.createElement("div"); n2.className="menu-h";
    n2.textContent="控えが"+kan(pend0)+"件。訊けるのは帳場の奥の机だけです。";
    menuHead(n2);
  }
  /* ここでできることが無くなったのに、ほかの場所には残っている、という形が
     いちばん詰まる。何が残っているかは言わない。尽きたことだけ言う。 */
  var here=TALK.filter(function(t){ return t.place===S.place && !S.talked[t.k]; }).length;
  var away=TALK.filter(function(t){ return t.place!==S.place && !S.talked[t.k]
      && (function(p){ return !p || !p.need || S.readCh[p.need]; })(
           PLACES.filter(function(x){ return x.k===t.place; })[0]); }).length;
  if(!here && away && S.incense>0){
    var e2=document.createElement("div"); e2.className="menu-h";
    e2.textContent="ここでできることは、もうありません。まだ線香は残っています。";
    menuHead(e2);
  }

  if(mid){
    var rh=document.createElement("div"); rh.className="menu-h";
    rh.textContent="この場は、まだ終わっていません。読み終えると、次を選べます。";
    menuHead(rh);
  }

  /* この夜が何をする夜なのかを、最初のうちだけ言う。
     言わないと、何のために聞き回っているのかが分からないまま線香が減る。 */
  S.navSeen=(S.navSeen||0)+1;
  if(S.navSeen<=3){
    var h=document.createElement("div"); h.className="menu-h";
    h.textContent = S.navSeen===1
      ? "朝までに、兄のことをどれだけ知るか。それだけの夜です。線香が一本尽きるごとに夜が進み、全部はできません。歩くのに線香は要りません。"
      : "朝までに、兄のことをどれだけ知るか。";
    menuHead(h);
  }
}

function menuHead(el){ var m=$("nav").querySelector(".menu"); if(m) m.prepend(el); }

function walkMenu(){
  var open=PLACES.filter(function(p){
    return p.k!==S.place && (!p.need || S.readCh[p.need]);
  });
  /* どこに何が残っているかを、数だけ出す。中身は言わない。
     分からないまま行き来するのが、この夜でいちばん疲れるところだった。 */
  var left=function(p){

          open.map(function(p){ return [p.name+"（"+left(p)+"）", function(){ enter(p.k); }]; })],

/* ---------- 朝 ---------- */
function maxSeals(v){ var n=0; SEALS.forEach(function(s){ if(v>=s.p) n++; }); return n; }

/* 買える上限は99%なので、残高は支払額の1%を下回らない。¥100,000以上は必ず一封、
   満額は必ず二封が開く。支払額×開封数の格子は96あるが、11は誰も到達できない。
   ED番号は到達する85組だけに、支払額の順で詰めて振る。 */
var MAXPCT=(function(){
  var s=[0];
  Object.keys(ASKS).forEach(function(k){
    var p=RATE[ASKS[k].tier], n=[];
    s.forEach(function(x){ if(x+p<=100) n.push(x+p); });
    s=s.concat(n);
  });
  return Math.max.apply(null,s);
})();
function minSeals(v){ return maxSeals(v*(100-MAXPCT)/100); }
function edNumber(i,op){
  var n=0;
  for(var j=0;j<i;j++) n+=maxSeals(STEPS[j])-minSeals(STEPS[j])+1;
  return n+(op-minSeals(STEPS[i]))+1;
}
function edName(v,op){ return (EDNAMES[String(v)]||{})[String(op)] || "（ED名は未執筆）"; }

/* 帳の言葉。額は漢数字で読む。 */
var KD="〇一二三四五六七八九".split("");
function kan4(v){
  var o="";
  [[1000,"千"],[100,"百"],[10,"十"]].forEach(function(x){
    var q=Math.floor(v/x[0])%10; if(q) o+=(q===1?"":KD[q])+x[1];
  });
  var r=v%10; if(r) o+=KD[r];
  return o;
}
function kan(n){
  if(n<0) return "△"+kan(-n);
  if(n===0) return "零";
  var man=Math.floor(n/10000), rest=n%10000;
  return (man?kan4(man)+"万":"")+(rest?kan4(rest):"");
}
var KY={"一":"いち","二":"に","三":"さん","四":"よん","五":"ご","六":"ろく","七":"なな","八":"はち","九":"きゅう"};
function kan4y(v){
  var o="", d=[[1000,"せん",{3:"さんぜん",8:"はっせん"}],[100,"ひゃく",{3:"さんびゃく",6:"ろっぴゃく",8:"はっぴゃく"}],[10,"じゅう",{}]];
  d.forEach(function(x){
    var q=Math.floor(v/x[0])%10; if(!q) return;
    o += x[2][q] || (q===1?"":KY[KD[q]])+x[1];
  });
  var r=v%10; if(r) o+=KY[KD[r]];
  return o;
}
function kany(n){
  if(n===0) return "れい";
  var man=Math.floor(n/10000), rest=n%10000;
  return (man?kan4y(man)+"まん":"")+(rest?kan4y(rest):"");
}
/* 額は本文に出るたびに読みを辞書へ足す。漢数字は書いた側でしか読めない。 */
function kin(n){
  var s="金"+kan(n)+"円";
  if(!RUBY[s]){ RUBY[s]="きん"+kany(n)+"えん"; RBIX=null; }
  return s;
}

function ch7state(){
  var bal=balance(), opened=0, next=null;
  SEALS.forEach(function(s){ if(bal>=s.p) opened++; else if(!next) next=s; });
  return { bal:bal, opened:opened, next:next, zero:S.paid===0,
           sf: next? next.p-bal : null, bought: Object.keys(S.bought).length>0 };
}

var ORDER7=["zero","paid","short","noshort","seal0","seal1","all"];

/* 原稿の [額] [不足] のような差し込みを、実際の額に置き換える。
   ここを通していなかったので、読み上げの一行がそのまま「[額]」と出ていた。 */
function fill(t,st){
  if(!t || t.indexOf("[")<0) return t;
  return t.replace(/\[(額|不足|持参|内引|残|次封)\]/g, function(_,k){
    if(k==="額")   return kin(st.bal);   // 朝に読まれるのは、残った額
    if(k==="持参") return kin(S.paid);
    if(k==="不足")  return st.sf!==null ? kin(st.sf) : "";
    if(k==="内引")  return kin(S.spent);
    if(k==="残")    return kin(st.bal);
    if(k==="次封")  return st.next ? st.next.n+"　"+kin(st.next.p)+"より" : "";
    return "";
  });
}

function ch7Text(id,st){
  var v=CH7.lines[id];
  if(!v) return null;
  var ok={ all:true, paid:!st.zero, zero:st.zero, short:st.sf!==null, noshort:st.sf===null,
           seal0:st.opened===0, seal1:st.opened>0 };
  var key=null;
  ORDER7.forEach(function(c){ if(key===null && v[c] && ok[c]) key=c; });
  if(key===null) return null;
  var m=v[key], t=m["1"];
  for(var lv=2; lv<=S.band+1; lv++) if(m[String(lv)]!==undefined) t=m[String(lv)];
  return fill(t,st);
}

function slipEl(st){

  }).join("");

    '<div class="slip-rule"></div>'+

    '</div>';
  return sl;
}


/* 見た結末の数だけを覚えておく。どれを見たかは出さない（次にいくら包むかの手がかりになる）。
   八十五という数を見せるのは、次の一周の理由になる。 */
function edList(){
  var a=[];
  try{ a=JSON.parse(localStorage.getItem("choba.ed")||"[]"); }catch(e){}
  return a;
}
function edSeen(n){
  var a=edList();
  if(a.indexOf(n)<0){
    a.push(n);
    try{ localStorage.setItem("choba.ed",JSON.stringify(a)); }catch(e){}
  }
  return a.length;
}

/* 八十五の結末を番号順に並べる。番号と名だけ。どの額で出るかは書かない。 */
function edAll(){
  var out=[];
  for(var i=0;i<STEPS.length;i++){
    var v=STEPS[i], lo=minSeals(v), hi=maxSeals(v);
    for(var op=lo;op<=hi;op++) out.push({ n:edNumber(i,op), nm:edName(v,op), v:v });
  }
  out.sort(function(x,y){ return x.n-y.n; });
  return out;
}

/* 帳。見た結末の一覧と、帳場さんの帳。 */
function drawTo(){

    h+='<div class="to-e'+(on?"":" off")+'"'+(on?' data-n="'+e.n+'"':'')+
       '><span class="no">ED-'+String(e.n).padStart(2,"0")+'</span><span class="nm">'+
       (on?e.nm:"")+'</span></div>';
  });
  h+='</div><div class="to-d" id="tod" hidden></div>';

  var hn=Math.min(got.length, HINTS.length);
  if(hn){
    h+='<div class="to-hint"><div class="hh">手がかり</div>';

    h+='</div>';
  }

  h+='<div class="to-c"><p class="lead">帳場の貝原さんが、あの晩のことを書き残しています。'+
     'あなたが見た朝の数だけ、読めるところが増えます。</p>';
  CHOBA.forEach(function(sec){
    var on=got.length>=sec.n;
    h+='<div class="to-s '+(on?"on":"lock")+'"><h4>'+sec.title+
       '<span>'+(on?"":"結末"+sec.n)+'</span></h4>';

    else   h+='<p class="lk">結末を'+kan(sec.n)+'つ見ると開きます。</p>';

  h+='</div>';
  $("tolist").innerHTML=h;
}

/* 第七章から最終行までを一本の列にする。¥0 は L054 で終わる。 */
function build7(st){
  var ids=CH7.order.slice(0, st.zero ? CH7.order.indexOf("L054")+1 : CH7.order.length);
  var out=[];
  ids.forEach(function(id){
    if(!st.zero && (id==="L052"||id==="L053"||id==="L054")) return;   // 精算書に入る
    var x=ch7Text(id,st);
    if(x===null || x.indexOf("（ここから")===0) return;
    if(id==="L025") out.push({gap:1600});          // 額を読む前。ここが作品の山
    if(!st.zero && id==="L051"){ out.push({slip:true}); return; }
    out.push({t:x, id:id, src:"7", se:(id==="L072"||id==="L073")?"fusuma":(id==="L050"?"kami":null)});
  });
  for(var i=0;i<st.opened;i++){
    var s=SEALTEXT[i];
    s.common.forEach(function(l,j){
      /* 鈴は第四封の一行目だけ。満額で四つ開いた人しか聞かない音 */
      out.push({t:fill(l,st),cls:"seal-t",se:(j===0?(i===3?"rin":"kami"):null)});
    });
    var ex=st.bought? s.bought : s.unbought;
    if(ex) ex.forEach(function(l){ out.push({t:fill(l,st),cls:"seal-t"}); });
  }
  if(st.opened>0) SEALCLOSE.forEach(function(l){ out.push({t:fill(l,st)}); });
  (FINALS[String(S.paid)]||[]).forEach(function(l){ out.push({t:fill(l,st),cls:"fin"}); });
  return out;
}

/* 仮の絵。構図の当たりだけ。img/ に実物を置けば使われない。 */
function phUrl(k){
  var P=ART[k].ph, W=1280, H=720;
  var o='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="'+P.sky[0]+'"/><stop offset="1" stop-color="'+P.sky[1]+'"/></linearGradient></defs>'+
    '<rect width="'+W+'" height="'+H+'" fill="url(#g)"/>'+
    '<ellipse cx="'+(W*.5)+'" cy="'+(H*P.horizon)+'" rx="'+(W*.72)+'" ry="'+(H*.24)+
    '" fill="hsl('+P.hue+',42%,52%)" opacity=".14"/>';
  P.sh.forEach(function(s){
    if(s[0]==="rect") o+='<rect x="'+(s[1]*W)+'" y="'+(s[2]*H)+'" width="'+(s[3]*W)+'" height="'+(s[4]*H)+'" fill="'+s[5]+'"/>';
    else o+='<ellipse cx="'+(s[1]*W)+'" cy="'+(s[2]*H)+'" rx="'+(s[3]*W)+'" ry="'+(s[4]*H)+'" fill="'+s[5]+'"/>';
  });
  o+='<text x="'+(W-20)+'" y="28" text-anchor="end" font-family="monospace" '+
     'font-size="13" fill="#FFFFFF" opacity=".24">仮の絵　'+esc(ART[k].name)+'</text>';
  return 'url("data:image/svg+xml;utf8,'+
    encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+
    '" viewBox="0 0 '+W+' '+H+'">'+o+'</svg>')+'")';
}

/* ファイルがあればそれ、無ければ仮の絵。判定は一度だけ。 */
var ARTOK={};
function bgUrl(k,cb){
  if(ARTOK[k]!==undefined){ cb(ARTOK[k]); return; }
  var src=ART[k].bg, im=new Image();
  im.onload =function(){ ARTOK[k]='url("'+src+'")'; cb(ARTOK[k]); };
  im.onerror=function(){ ARTOK[k]=phUrl(k); cb(ARTOK[k]); };
  im.src=src;
}

/* 人物。立ち絵が届くまで空。顔は帯4まで隠す（ASSETS.md 1）。 */
function setChar(c){
  S.char=c||null;
  $("artChar").style.backgroundImage    = c ? 'url("'+c.body+'")' : "none";
  $("artCharSil").style.backgroundImage = c ? 'url("'+c.sil+'")'  : "none";
  placeFace();
}

/* cover の拡大率と余白から、顔の円の画面上の位置を出す。 */
function placeFace(){
  var c=S.char, el=$("artFace");
  if(!c || !c.face){ el.style.width="0"; el.style.height="0"; return; }
  var f=c.face, W=f.w||1400, H=f.h||2000;
  var vh=innerHeight, s=vh*.92/H, ox=(innerWidth-W*s)/2, oy=vh-H*s, r=f.r*s*1.3;
  el.style.left=(ox+f.x*s-r)+"px"; el.style.top=(oy+f.y*s-r)+"px";
  el.style.width=(r*2)+"px"; el.style.height=(r*2)+"px";
}

function setArt(k){
  if(!ART[k]) return;
  S.art=k;
  bgUrl(k,function(u){ if(S.art===k) $("artBg").style.backgroundImage=u; });
  $("art").className="b"+(S.band+1);
  placeFace();
}
addEventListener("resize",placeFace);

/* ---------- 検証モード ----------
   本編には出ない。制作側が中の状態を見て、任意の局面に飛ぶための口。
   決済を入れる前に、38額 × 開封 × 購入の組をここから機械で舐める。 */
window.__dev = {
  STEPS: STEPS,
  ASKS: Object.keys(ASKS),

  state: function(){
    var st=ch7state();
    return { idx:S.idx, paid:S.paid, band:S.band+1, spent:S.spent, balance:balance(),
             incense:S.incense, place:S.place, opened:S.opened, done:S.done,
             bought:Object.keys(S.bought), noted:Object.keys(S.noted),
             seals:st.opened, short:st.sf, ed:S.done?edNumber(S.idx,st.opened):null,
             line:$("wt").textContent, who:$("who").hidden?null:$("who").textContent,
             card:$("card").textContent||null, log:S.log.length,
             chapcard:!!CARD.go, chapSeen:Object.keys(S.seenChap),
             hamidashi:(function(){ var w=$("wt"); return w?Math.max(0,w.scrollHeight-w.clientHeight):0; })(),
             kanjiBare:(function(){        // ふりがなの付いていない漢字を数える
               var w=$("wt"), n=0;
               if(!RUBYON||!w) return 0;
               (function walk(e){
                 for(var i=0;i<e.childNodes.length;i++){
                   var c=e.childNodes[i];
                   if(c.nodeType===3){ var m=c.nodeValue.match(/[\u4e00-\u9fff]/g); if(m) n+=m.length; }
                   else if(c.nodeType===1 && c.tagName!=="RUBY") walk(c);
                 }
               })(w);
               return n;
             })(),
             snag:Object.keys(S.snag), snagT:Object.keys(S.snagT), snagN:snagCount(),
             scene:S.art, sceneName:(ART[S.art]||{}).name||null,
             nav:Array.prototype.map.call(document.querySelectorAll("#nav button"),
                 function(b){ return { t:b.textContent, off:b.disabled }; }) };
  },

  /* 窓を最後まで送る。札が出ていれば送って先へ進む。 */
  flush: function(max){
    var n=0, idle=0; Q.fast=true;
    while(n++ < (max||3000)){
      if(CARD.go){ CARD.go(); idle=0; continue; }      // 章の札は飛ばす
      if(Q.hold){ tap(null); idle=0; continue; }
      if(Q.tid){ revealAll(); idle=0; continue; }
      if(Q.i < Q.list.length){ nextLine(); idle=0; continue; }
      if(idle++) break;
      nextLine();
    }
    Q.fast=false;
    return n;
  },

  /* 間を飛ばす。検証のときだけ */
  fast: function(v){ DEVFAST=!!v; },

  /* いま窓に出ている、指せる語句 */
  asks: function(){
    return Array.prototype.map.call($("wt").querySelectorAll(".ask"),
      function(e){ return { k:e.dataset.k, phrase:e.textContent, used:e.classList.contains("used") }; });
  },

  /* 章を頭から送りながら、その語句が出たところで指す。無ければ null */
  point: function(k){
    for(var i=0;i<600;i++){
      if(Q.tid){ revealAll(); }
      var a=$("wt").querySelector('.ask[data-k="'+k+'"]:not(.used)');
      if(a){ a.click(); return true; }
      if(Q.i>=Q.list.length) break;
      nextLine();
    }
    return false;
  },

  nav: function(label){
    var all=Array.prototype.slice.call(document.querySelectorAll("#nav button"));
    var b=all.filter(function(x){ return x.textContent===label; })[0]
        || all.filter(function(x){ return x.textContent.indexOf(label)===0; })[0];
    if(!b) throw new Error("選択肢が無い: "+label+" ／ ある: "+
      Array.prototype.map.call(document.querySelectorAll("#nav button"),function(x){return x.textContent;}).join("|"));
    if(b.disabled) throw new Error("選べない: "+label);
    b.click(); return true;
  },

  /* 支払いを飛ばして夜へ */
  begin: function(idx){ S.idx=idx; drawPay(); start(); return this.flush(); },

  /* 夜を飛ばして朝へ。買い物は指定のものだけ済ませた状態にする */
  jump: function(idx, buys){
    S.idx=idx; drawPay(); start();
    (buys||[]).forEach(function(k){
      if(!ASKS[k]) throw new Error("そんな語句は無い: "+k);
      S.bought[k]=true; S.spent+=priceOf(ASKS[k].tier);
    });
    if(S.spent>S.paid) throw new Error("買いすぎ: "+S.spent+" > "+S.paid);
    S.done=true; S.incense=0; drawSticks(); morning();
    return this.flush();
  },

  log: function(){ return S.log.slice(); },
  auto: function(v){ setAuto(v); }, skip: function(v){ setSkip(v); },
  step: function(){ if(Q.tid) revealAll(); else if(Q.hold) tap(null); else nextLine(); },
  seen: function(){ return SEEN.size; },
  art: function(){
    var used={}, miss=[];
    Object.keys(BGAT).forEach(function(c){ Object.keys(BGAT[c]).forEach(function(l){
      var k=BGAT[c][l]; used[k]=1; if(!ART[k]) miss.push(c+"/"+l+" → "+k); }); });
    Object.keys(PLACEBG).forEach(function(p){
      var k=PLACEBG[p]; used[k]=1; if(!ART[k]) miss.push("場所 "+p+" → "+k); });
    return { scenes:Object.keys(ART).map(function(k){ return {k:k, name:ART[k].name, used:!!used[k]}; }),
             missing:miss, real:Object.keys(ARTOK).filter(function(k){ return ARTOK[k].indexOf("data:")<0; }) };
  },
  night: function(){
    var by={};
    TALK.forEach(function(t){ by[t.place]=(by[t.place]||0)+1; });
    return { incense:INCENSE, talks:TALK.length, byPlace:by,
             lines:TALK.reduce(function(a,t){ return a+t.lines.length; },0) };
  },

  /* いまの帯で、その章の全行と、指せる語句の位置。書き換えで語句が消えていないかを見る。 */
  chapter: function(src){
    var C=CH[src]; if(!C) throw new Error("そんな章は無い: "+src);
    return C.order.map(function(id){
      var t=chText(src,id), hit=[];
      Object.keys(ASKS).forEach(function(k){
        var A=ASKS[k];
        if(A.ch===src && A.line===id && t.indexOf(A.phrase)>=0) hit.push(k);
      });
      return { id:id, t:t, asks:hit };
    });
  },

  /* いま窓に積まれている行（送っていない分も含む） */
  queue: function(){ return Q.list.map(function(x){ return x.card?"[札]":x.t; }); }
};
window.__t = function(idx,buys){ return window.__dev.jump(idx,buys); };
