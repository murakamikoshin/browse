<style>
:root{
  --ink:#0A0E10; --edge:#1E2729; --fg:#DCE1DD; --fg-dim:#7E8A86; --fg-faint:#4A5552;

}
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition-duration:.001s !important; } }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--ink); color:var(--fg);
  font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:16px; line-height:2.3; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(100% 60% at 50% 0%, var(--accent-soft), transparent 62%);
  opacity:calc(.4 + var(--glow)*.6); transition:opacity 1s ease;
}
.bar{
  position:sticky; top:0; z-index:10; background:rgba(10,14,16,.93);
  border-bottom:1px solid var(--edge); backdrop-filter:blur(9px);
}
.bar-in{
  max-width:40em; margin:0 auto; padding:12px clamp(16px,4vw,26px);
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.tag{ font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.22em;
      text-transform:uppercase; color:var(--fg-faint); white-space:nowrap; }
.amt{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
      font-size:1.15rem; color:var(--accent); min-width:5.6em; transition:color .7s ease; }
.band{ font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.16em;
       color:var(--fg-faint); border:1px solid var(--edge); padding:3px 9px; white-space:nowrap; }
input[type=range]{ flex:1 1 170px; min-width:120px; height:20px; cursor:pointer;
  -webkit-appearance:none; appearance:none; background:transparent; }
input[type=range]::-webkit-slider-runnable-track{ height:1px; background:var(--edge); }
input[type=range]::-moz-range-track{ height:1px; background:var(--edge); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:11px; height:11px;
  margin-top:-5px; background:var(--accent); border:none; border-radius:50%; transition:background .7s ease; }
input[type=range]::-moz-range-thumb{ width:11px; height:11px; background:var(--accent); border:none; border-radius:50%; }
input[type=range]:focus-visible{ outline:1px solid var(--accent); outline-offset:5px; }
.dev{ display:flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace;
      font-size:.6rem; letter-spacing:.1em; color:var(--fg-faint); cursor:pointer; white-space:nowrap; }
.dev input{ accent-color:var(--accent); }

main{ position:relative; z-index:1; max-width:40em; margin:0 auto; padding:56px clamp(16px,4vw,26px) 120px; }
.ch{ font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.3em;
     color:var(--fg-faint); margin-bottom:8px; }
h1{ font-size:1.5rem; font-weight:800; letter-spacing:.14em; margin:0 0 44px; }
p.l{ margin:0 0 1.35em; transition:color .5s ease; }
p.l.changed{ color:#E7EBE7; }
.mark p.l.changed{ box-shadow:inset 2px 0 0 var(--accent); padding-left:14px; margin-left:-16px; }
.swap{ animation:sw .55s ease-out; }
@keyframes sw{ from{ opacity:0; filter:blur(3px); } to{ opacity:1; filter:none; } }
.foot{ margin-top:70px; padding-top:24px; border-top:1px solid var(--edge);
       font-size:.74rem; line-height:1.95; color:var(--fg-faint); }
.foot p{ margin:0 0 .7em; } .foot b{ color:var(--fg-dim); font-weight:400; }
.stat{ font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--fg-dim); letter-spacing:.06em; }
</style>

(function(){
  "use strict";
  var STEPS=[];
  for(var a=0;a<1000;a+=100) STEPS.push(a);
  for(var b=1000;b<10000;b+=1000) STEPS.push(b);
  for(var c=10000;c<100000;c+=10000) STEPS.push(c);
  for(var d=100000;d<1000000;d+=100000) STEPS.push(d);
  STEPS.push(1000000);

  var BANDS=[0,1000,10000,100000,1000000];
  var ACC=[["#6E7673","rgba(110,118,115,.12)",0],
           ["#8E8564","rgba(142,133,100,.14)",.24],
           ["#A79058","rgba(167,144,88,.16)",.46],
           ["#D4A63A","rgba(212,166,58,.18)",.74],
           ["#EFBA26","rgba(239,186,38,.21)",1]];

  var elAmt=document.getElementById("amt"), elBand=document.getElementById("band"),
      elBody=document.getElementById("body"), elSl=document.getElementById("sl"),
      elMk=document.getElementById("mk"), elStat=document.getElementById("stat");
  var prev={}, first=true;

  function bandOf(v){ var b=0; BANDS.forEach(function(m,i){ if(v>=m) b=i; }); return b; }
  function yen(n){ return "¥"+n.toLocaleString("ja-JP"); }

  function textOf(id, amount, band){
    var t = amount===0 ? DATA.base[id].zero : DATA.base[id].paid;
    var o = DATA.ov[id];
    if(o){ for(var lv=2; lv<=band+1; lv++){ if(o[String(lv)]!==undefined) t=o[String(lv)]; } }
    return t;
  }

  function render(){
    var amount=STEPS[+elSl.value], band=bandOf(amount);
    elAmt.textContent=yen(amount);
    elBand.textContent="帯"+(band+1);
    var a=ACC[band], r=document.documentElement.style;
    r.setProperty("--accent",a[0]); r.setProperty("--accent-soft",a[1]); r.setProperty("--glow",String(a[2]));

    var frag=document.createDocumentFragment(), changed=0, chars=0;
    DATA.order.forEach(function(id){
      var t=textOf(id,amount,band);
      chars+=t.length;
      var b1 = DATA.base[id].paid;
      var p=document.createElement("p");
      p.className="l"+(t!==b1?" changed":"");
      if(t!==b1) changed++;
      p.textContent=t;
      if(!first && prev[id]!==t) p.classList.add("swap");
      prev[id]=t;
      frag.appendChild(p);
    });
    elBody.replaceChildren(frag);
    elStat.textContent="帯"+(band+1)+"　"+chars+"字　／　帯1から変わった行 "+changed+" / 56";
    first=false;
  }

  elSl.addEventListener("input",render);
  elMk.addEventListener("change",function(){ elBody.classList.toggle("mark",this.checked); });
  render();
})();
</script>
</body>
</html>
